<!DOCTYPE html>
<html lang="en">
<head>
<meta charset=utf-8>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Greenhouse — Five Specimens</title>
<style>
:root{
  --fog:#dfe8e0;
  --frame:#2a3a3a;
  --ink:#22302a;
  --dim:#5d7068;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:
    radial-gradient(120% 90% at 50% 0%, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 55%),
    linear-gradient(180deg,#e9f0e9 0%, var(--fog) 42%, #d3ded4 100%);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--ink);
  overflow:hidden;
}
#stage{position:fixed;inset:0}
#art{display:block;width:100%;height:100%}
#hud{
  position:fixed;left:0;right:0;top:0;
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:13px clamp(14px,2.5vw,28px);
  background:linear-gradient(to bottom,rgba(233,240,233,.96) 30%,rgba(233,240,233,0));
  z-index:2;flex-wrap:wrap;
}
.brand{
  font-size:clamp(11px,1.5vw,14px);letter-spacing:.32em;
  text-transform:uppercase;font-weight:600;color:var(--ink);
}
.brand span{color:var(--dim);font-weight:400;letter-spacing:.26em}
.ctrl{display:flex;gap:12px;align-items:center}
.sl{display:flex;align-items:center;gap:8px}
.sl i{
  font-style:normal;font-size:10px;letter-spacing:.26em;color:var(--dim);
}
input[type=range]{
  -webkit-appearance:none;appearance:none;
  width:clamp(110px,22vw,190px);height:22px;background:transparent;cursor:pointer;
}
input[type=range]::-webkit-slider-runnable-track{
  height:4px;border-radius:4px;
  background:linear-gradient(90deg,#b9cdb6,#7fa08a 60%,#e8c87a);
}
input[type=range]::-moz-range-track{
  height:4px;border-radius:4px;
  background:linear-gradient(90deg,#b9cdb6,#7fa08a 60%,#e8c87a);
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:16px;height:16px;border-radius:50%;margin-top:-6px;
  background:radial-gradient(circle at 35% 35%,#fff2c8,#e8b25a);
  box-shadow:0 0 10px rgba(232,178,90,.65);border:1px solid #caa050;
}
input[type=range]::-moz-range-thumb{
  width:15px;height:15px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fff2c8,#e8b25a);
  box-shadow:0 0 10px rgba(232,178,90,.65);border:1px solid #caa050;
}
.chip{
  font:inherit;font-size:11px;letter-spacing:.24em;
  padding:7px 15px;border-radius:999px;
  border:1px solid rgba(42,58,58,.35);
  background:rgba(255,255,255,.5);color:var(--dim);cursor:pointer;
  transition:all .25s ease;
}
.chip:hover{border-color:rgba(42,58,58,.7);color:var(--ink)}
.chip.on{
  color:#fff;font-weight:600;border-color:transparent;
  background:linear-gradient(180deg,#6f9ec2,#3d6a94);
  box-shadow:0 0 14px rgba(90,140,190,.45);
}
#hint{
  position:fixed;top:64px;right:clamp(14px,2.5vw,28px);z-index:2;
  font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim);
  background:rgba(255,255,255,.5);padding:5px 10px;border-radius:8px;
  transition:opacity .8s ease;pointer-events:none;
}
#caption{
  position:fixed;left:clamp(14px,2.5vw,28px);bottom:15px;z-index:2;
  font-size:clamp(10px,1.2vw,12px);letter-spacing:.42em;text-transform:uppercase;
  color:var(--dim);pointer-events:none;
}
#caption b{color:#3c6a4a;font-weight:600;letter-spacing:.3em}
.hit{cursor:pointer}
</style>
</head>

<header id="hud">

<div id="hint">click a pot to water</div>
<div id="caption">GREENHOUSE &#8212; 5 SPECIMENS &#183; <b id="watered">WATERED &#215;0</b></div>
<script>
(function(){
  'use strict';
  var sunSlider=document.getElementById('sun');
  var rainBtn=document.getElementById('rain');
  var hint=document.getElementById('hint');
  var wateredEl=document.getElementById('watered');
  var fog1=document.getElementById('fog1');
  var fog2=document.getElementById('fog2');
  var beam=document.getElementById('beam');
  var shine=document.getElementById('shineGrad');
  var dropsG=document.getElementById('drops');
  var wisps=document.querySelectorAll('.wisp');
  var burstPaths=document.querySelectorAll('#burst path');

  var T=0,lastTs=0,last=0;
  var sunPos=0.42;
  var rain=false,rainAlpha=0;
  var watered=0;
  var burstCursor=0;

  var plants=[];
  var hitEls=document.querySelectorAll('.hit');
  var i;
  for(i=0;i<hitEls.length;i++){
    var g=hitEls[i].parentNode;
    plants.push({
      el:g,
      art:g.querySelector('.art'),
      sway:g.querySelector('.sway'),
      shad:g.querySelector('.shad'),
      soil:g.querySelector('.soil'),
      x:parseInt(hitEls[i].getAttribute('data-i'),10),
      stage:0,sCur:1,sTgt:1,
      ph:i*1.7,
      soilT:0
    });
  }
  var dropData=[];
  var lines=dropsG.querySelectorAll('line');
  for(i=0;i<lines.length;i++){
    dropData.push({el:lines[i],x:300,y:200,sp:80,len:12});
  }

  function seedDrops(){
    var d;
    for(d=0;d<dropData.length;d++){
      var dd=dropData[d];
      dd.x=285+Math.random()*430;
      dd.y=160+Math.random()*320;
      dd.sp=55+Math.random()*90;
      dd.len=8+Math.random()*10;
    }
  }

  function water(idx){
    var p=plants[idx];
    if(p.stage>=2){return;}
    p.stage+=1;
    p.sTgt=1+0.05*p.stage;
    p.soilT=T;
    watered+=1;
    wateredEl.textContent='WATERED ×'+watered;
    var n=6,k=0;
    for(k=0;k<n;k++){
      var bp=burstPaths[burstCursor];
      burstCursor=(burstCursor+1)%burstPaths.length;
      bp.setAttribute('data-x',(p.x*90+320+(Math.random()*24-12)).toFixed(1));
      bp.setAttribute('data-t0',T.toFixed(3));
      bp.setAttribute('data-dur',(0.9+Math.random()*0.5).toFixed(2));
    }
  }

  var hi=0;
  for(hi=0;hi<hitEls.length;hi++){
    (function(el){
      el.addEventListener('click',function(){
        var idx=parseInt(el.getAttribute('data-i'),10);
        water(idx);
        hint.style.opacity='0';
      });
    })(hitEls[hi]);
  }

  sunSlider.addEventListener('input',function(){
    sunPos=(+sunSlider.value)/100;
  });

  rainBtn.addEventListener('click',function(){
    rain=!rain;
    rainBtn.classList.toggle('on',rain);
    if(rain){seedDrops();}
  });

  function plantX(idx){return 320+idx*90;}

  function frame(ts){
    requestAnimationFrame(frame);
    try{
      T=ts/1000;
      var dt=Math.min(0.05,T-last);
      last=T;
      rainAlpha+= (rain?1:-1)*dt*1.6;
      if(rainAlpha<0){rainAlpha=0;}
      if(rainAlpha>1){rainAlpha=1;}

      fog1.setAttribute('cx',(300+Math.sin(T*0.07)*240).toFixed(1));
      fog2.setAttribute('cx',(720+Math.sin(T*0.05+2.1)*260).toFixed(1));

      var bx=230+sunPos*540;
      beam.setAttribute('points',
        (bx-30).toFixed(1)+',148 '+(bx+30).toFixed(1)+',148 '+(bx+95).toFixed(1)+',496 '+(bx-65).toFixed(1)+',496');
      shine.setAttribute('x1',(bx-120).toFixed(1));
      shine.setAttribute('y1','180');
      shine.setAttribute('x2',(bx+120).toFixed(1));
      shine.setAttribute('y2','400');

      var d,k,p;
      for(k=0;k<plants.length;k++){
        p=plants[k];
        p.sCur+=(p.sTgt-p.sCur)*Math.min(1,dt*3.2);
        p.art.setAttribute('transform','scale('+p.sCur.toFixed(3)+')');
        var swayA=Math.sin(T*0.9+p.ph)*1.3+rainAlpha*Math.sin(T*2.7+p.ph*1.4)*2.4;
        p.sway.setAttribute('transform','rotate('+swayA.toFixed(2)+' 0 4)');
        var dx=(0.5-sunPos)*120;
        p.shad.setAttribute('cx',dx.toFixed(1));
        p.shad.setAttribute('opacity',(0.13+Math.abs(0.5-sunPos)*0.14).toFixed(3));
        var dark=Math.max(0,1-(T-p.soilT)/1.6);
        if(dark>0){
          p.soil.setAttribute('fill',dark>0.5?'#2e2118':'#40301f');
        }else{
          p.soil.setAttribute('fill','#4a3527');
        }
      }

      for(d=0;d<8;d++){
        var t=((T*0.22)+d/8)%1;
        var sx=plantX(2)+(d-3.5)*4.5;
        var a=Math.sin(Math.PI*t)*0.42;
        var o1=Math.sin(T*1.4+d*1.3)*10;
        var o2=Math.sin(T*1.1+d*2.1)*15;
        var ex=sx+Math.sin(T*0.8+d*1.9)*13;
        var ey=466-95*t;
        wisps[d].setAttribute('d','M'+sx.toFixed(1)+',466 C'+(sx+o1).toFixed(1)+','+(466-32).toFixed(1)+' '+(sx+o2).toFixed(1)+','+(466-62).toFixed(1)+' '+ex.toFixed(1)+','+ey.toFixed(1));
        wisps[d].setAttribute('opacity',a.toFixed(3));
      }

      for(d=0;d<burstPaths.length;d++){
        var bp=burstPaths[d];
        var t0=parseFloat(bp.getAttribute('data-t0')||'0');
        var dur=parseFloat(bp.getAttribute('data-dur')||'1');
        var bb=(T-t0)/dur;
        if(bp.getAttribute('data-x')&&bb>0&&bb<1){
          var bsx=parseFloat(bp.getAttribute('data-x'));
          var bo1=Math.sin(T*3+d)*8;
          var bey=464-105*bb;
          bp.setAttribute('d','M'+bsx.toFixed(1)+',466 C'+(bsx+bo1).toFixed(1)+','+(466-28).toFixed(1)+' '+(bsx+bo1*1.5).toFixed(1)+','+(466-55).toFixed(1)+' '+(bsx+bo1*0.6).toFixed(1)+','+bey.toFixed(1));
          bp.setAttribute('opacity',(Math.sin(Math.PI*bb)*0.55).toFixed(3));
        }else if(bb>=1){
          bp.setAttribute('opacity','0');
          bp.setAttribute('data-x','');
        }
      }

      for(d=0;d<dropData.length;d++){
        var dd=dropData[d];
        var dl=dd.el;
        if(rainAlpha>0.02){
          dd.y+=dd.sp*dt;
          if(dd.y>488){
            dd.y=155+Math.random()*40;
            dd.x=285+Math.random()*430;
          }
          var wob=Math.sin(T*5+dd.x*0.3)*1.4;
          var fade=Math.min(1,(dd.y-150)/40,(492-dd.y)/50);
          dl.setAttribute('x1',(dd.x+wob-dd.len*0.12).toFixed(1));
          dl.setAttribute('y1',(dd.y-dd.len).toFixed(1));
          dl.setAttribute('x2',(dd.x+wob).toFixed(1));
          dl.setAttribute('y2',dd.y.toFixed(1));
          dl.setAttribute('opacity',(rainAlpha*Math.max(0,fade)*0.85).toFixed(3));
        }else{
          dl.setAttribute('opacity','0');
        }
      }
    }catch(err){}
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
