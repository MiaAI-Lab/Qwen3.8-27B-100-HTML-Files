<!DOCTYPE html>
<html lang="en">
<head>
<meta charset=utf-8>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dune Dusk — 037</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #1a0f2e;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    color: #f6e3c8;
  }
  #stage {
    position: fixed;
    inset: 0;
    height: 100dvh;
    width: 100vw;
  }
  #scene {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .hud {
    position: fixed;
    left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: clamp(10px, 2.2vw, 22px) clamp(14px, 3vw, 30px);
    pointer-events: none;
    z-index: 2;
  }
  .hud.top { top: 0; }
  .hud.bottom { bottom: 0; align-items: flex-end; }
  .caps {
    font-size: clamp(10px, 1.4vw, 13px);
    letter-spacing: 0.42em;
    text-transform: uppercase;
    font-weight: 600;
    color: rgba(255, 224, 186, 0.85);
    text-shadow: 0 1px 8px rgba(0,0,0,0.5);
  }
  .index {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    color: rgba(255, 210, 122, 0.55);
  }
  .sunbox {
    pointer-events: auto;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
    background: rgba(26, 15, 46, 0.34);
    border: 1px solid rgba(255, 210, 122, 0.22);
    border-radius: 10px;
    padding: 10px 14px;
    backdrop-filter: blur(6px);
  }
  .sunbox label {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 9px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(255, 210, 122, 0.75);
  }
  .sunrow { display: flex; align-items: center; gap: 10px; }
  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    width: clamp(120px, 22vw, 200px);
    height: 3px;
    border-radius: 2px;
    background: linear-gradient(90deg, #3a1c2e, #ffd27a);
    outline: none;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 13px; height: 13px;
    border-radius: 50%;
    background: #ffd27a;
    border: 2px solid #3a1c2e;
    box-shadow: 0 0 8px rgba(255, 210, 122, 0.8);
  }
  input[type=range]::-moz-range-thumb {
    width: 13px; height: 13px;
    border-radius: 50%;
    background: #ffd27a;
    border: 2px solid #3a1c2e;
    box-shadow: 0 0 8px rgba(255, 210, 122, 0.8);
  }
  .sunval {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 11px;
    color: #ffd27a;
    min-width: 34px;
    text-align: right;
  }
  @media (max-width: 480px) {
    .sunbox { padding: 8px 10px; }
  }
</style>
</head>
<body>
<div id="stage"><canvas id="scene"></canvas></div>

<header class="hud top">
  <div class="index">GALLERY 100 &middot; NNN 037</div>
  <div class="sunbox">
    <label for="sun">Sun</label>
    <div class="sunrow">
      <input type="range" id="sun" min="0" max="100" value="30" step="1" aria-label="Sun altitude">
      <span class="sunval" id="sunval">0.30</span>
    </div>
  </div>
</header>

<footer class="hud bottom">
  <div class="caps">Dune / Dusk</div>
  <div class="caps" style="opacity:0.55">Heat band &middot; 03 px</div>
</footer>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById("scene");
  var ctx = canvas.getContext("2d");
  var off = document.createElement("canvas");
  var octx = off.getContext("2d");

  var W = 0, H = 0, DPR = 1, horizon = 0;
  var sunA = 0.30;
  var sunX = 0;
  var t = 0;
  var lastTs = 0;

  var RIDGE_COLORS = ["#b3543a", "#8a3d33", "#5e2a33", "#3a1c2e"];
  var CREST = [0.585, 0.665, 0.755, 0.865];
  var PHASE = [0.12, 0.42, 0.68, 0.30];
  var AMP = [0.030, 0.040, 0.052, 0.062];

  var stars = [];
  for (let i = 0; i < 110; i++) {
    stars.push({
      x: ((i * 0.6180339) % 1),
      y: ((i * 0.381966) % 1) * 0.42,
      r: 0.5 + ((i * 7) % 10) / 9,
      tw: (i % 17) / 4
    });
  }

  var birds = [
    { x: 0.15, y: 0.16, sp: 0.013, ph: 0.0, s: 1.0 },
    { x: 0.52, y: 0.10, sp: 0.009, ph: 2.1, s: 0.8 },
    { x: 0.80, y: 0.22, sp: 0.016, ph: 4.4, s: 1.2 }
  ];

  function fit() {
    var r = canvas.parentElement.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, Math.floor(r.width));
    H = Math.max(1, Math.floor(r.height));
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    off.width = W * DPR;
    off.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    octx.setTransform(DPR, 0, 0, DPR, 0, 0);
    horizon = H * 0.545;
    sunX = W * 0.73;
  }

  function hex2rgb(h) {
    return [
      parseInt(h.slice(1, 3), 16),
      parseInt(h.slice(3, 5), 16),
      parseInt(h.slice(5, 7), 16)
    ];
  }

  function mix(c1, c2, k) {
    var a = hex2rgb(c1), b = hex2rgb(c2);
    var r = Math.round(a[0] + (b[0] - a[0]) * k);
    var g = Math.round(a[1] + (b[1] - a[1]) * k);
    var bl = Math.round(a[2] + (b[2] - a[2]) * k);
    return "rgb(" + r + "," + g + "," + bl + ")";
  }

  function ridgeY(i, fx) {
    var u = fx * 2 * Math.PI;
    var v =
      Math.sin(u + PHASE[i] * 6.28) * 0.62 +
      Math.sin(u * 2.7 + PHASE[i] * 11.0) * 0.38;
    return H * CREST[i] + v * H * AMP[i];
  }

  function traceRidge(i, c) {
    var n = 14;
    c.beginPath();
    c.moveTo(0, ridgeY(i, 0));
    for (let k = 0; k <= n; k++) {
      let fx = k / n;
      let y = ridgeY(i, fx);
      if (k === n) {
        c.lineTo(W, y);
      } else {
        let fxm = (k + 0.5) / n;
        let ym = ridgeY(i, fxm);
        c.quadraticCurveTo(fx * W * 0.98 + W * 0.01, y, fxm * W, ym);
      }
    }
    c.lineTo(W, H);
    c.lineTo(0, H);
    c.closePath();
  }

  function drawSky(c) {
    var dark = Math.min(1, Math.max(0, (0.42 - sunA) / 0.42));
    var top = mix("#ff9e5e", "#1a0f2e", dark * 0.92);
    var mid = mix("#c86a5e", "#170d2a", dark * 0.9);
    var bot = mix("#3a1e5e", "#1a0f2e", dark * 0.95);
    var g = c.createLinearGradient(0, 0, 0, H * 0.85);
    g.addColorStop(0, top);
    g.addColorStop(0.55, mid);
    g.addColorStop(1, bot);
    c.fillStyle = g;
    c.fillRect(0, 0, W, H);

    if (dark > 0.02) {
      c.save();
      for (let i = 0; i < stars.length; i++) {
        let s = stars[i];
        let a = dark * (0.35 + 0.65 * Math.abs(Math.sin(t * 0.7 + s.tw)));
        c.globalAlpha = Math.min(1, a);
        c.fillStyle = "#fff6e0";
        c.beginPath();
        c.arc(s.x * W, s.y * H, s.r, 0, 6.2832);
        c.fill();
      }
      c.restore();
      c.globalAlpha = 1;
    }
  }

  function drawSun(c) {
    var sy = horizon - 14 - sunA * H * 0.46;
    var sr = 14 + sunA * 10;
    var glowR = sr * 6.5;
    c.save();
    var gg = c.createRadialGradient(sunX, sy, 0, sunX, sy, glowR);
    gg.addColorStop(0, "rgba(255,214,140,0.85)");
    gg.addColorStop(0.25, "rgba(255,190,110,0.34)");
    gg.addColorStop(1, "rgba(255,170,90,0)");
    c.fillStyle = gg;
    c.beginPath();
    c.arc(sunX, sy, glowR, 0, 6.2832);
    c.fill();

    c.fillStyle = "#ffd27a";
    c.beginPath();
    c.arc(sunX, sy, sr, 0, 6.2832);
    c.fill();
    c.fillStyle = "rgba(255,246,214,0.9)";
    c.beginPath();
    c.arc(sunX, sy, sr * 0.55, 0, 6.2832);
    c.fill();
    c.restore();
  }

  function drawRidges(c) {
    for (let i = 0; i < 4; i++) {
      traceRidge(i, c);
      c.fillStyle = RIDGE_COLORS[i];
      c.fill();

      c.save();
      traceRidge(i, c);
      c.clip();
      var vg = c.createLinearGradient(0, H * CREST[i] - H * AMP[i], 0, H);
      vg.addColorStop(0, "rgba(255,190,140," + (0.10 + sunA * 0.14).toFixed(3) + ")");
      vg.addColorStop(1, "rgba(10,4,20,0.42)");
      c.fillStyle = vg;
      c.fillRect(0, 0, W, H);

      var hg = c.createLinearGradient(sunX - W * 0.05, 0, sunX - W * 0.55, 0);
      hg.addColorStop(0, "rgba(255,205,150,0.16)");
      hg.addColorStop(1, "rgba(8,3,16,0.55)");
      c.fillStyle = hg;
      c.fillRect(0, 0, W * 0.7, H);
      c.restore();
    }
  }

  function drawCactus(c) {
    var baseY = ridgeY(3, 0.24);
    var x = W * 0.24;
    var hgt = H * 0.085;
    c.fillStyle = "#2a1524";
    c.beginPath();
    c.moveTo(x - 5, baseY + 4);
    c.lineTo(x - 5, baseY - hgt);
    c.quadraticCurveTo(x, baseY - hgt - 10, x + 5, baseY - hgt);
    c.lineTo(x + 5, baseY + 4);
    c.closePath();
    c.fill();

    c.beginPath();
    c.moveTo(x + 5, baseY - hgt * 0.55);
    c.quadraticCurveTo(x + 16, baseY - hgt * 0.55, x + 16, baseY - hgt * 0.72);
    c.lineTo(x + 16, baseY - hgt * 0.82);
    c.quadraticCurveTo(x + 20, baseY - hgt * 0.9, x + 24, baseY - hgt * 0.86);
    c.lineTo(x + 24, baseY - hgt * 0.62);
    c.quadraticCurveTo(x + 22, baseY - hgt * 0.48, x + 5, baseY - hgt * 0.44);
    c.closePath();
    c.fill();

    c.beginPath();
    c.moveTo(x - 5, baseY - hgt * 0.4);
    c.quadraticCurveTo(x - 15, baseY - hgt * 0.4, x - 15, baseY - hgt * 0.55);
    c.lineTo(x - 15, baseY - hgt * 0.62);
    c.quadraticCurveTo(x - 19, baseY - hgt * 0.7, x - 23, baseY - hgt * 0.66);
    c.lineTo(x - 23, baseY - hgt * 0.44);
    c.quadraticCurveTo(x - 21, baseY - hgt * 0.32, x - 5, baseY - hgt * 0.30);
    c.closePath();
    c.fill();

    c.fillStyle = "#241220";
    c.beginPath();
    c.moveTo(W * 0.60, baseY + 6);
    c.quadraticCurveTo(W * 0.615, baseY - 14, W * 0.645, baseY - 10);
    c.quadraticCurveTo(W * 0.67, baseY - 16, W * 0.69, baseY + 4);
    c.closePath();
    c.fill();

    c.beginPath();
    c.moveTo(W * 0.71, baseY + 6);
    c.quadraticCurveTo(W * 0.72, baseY - 6, W * 0.745, baseY - 3);
    c.quadraticCurveTo(W * 0.76, baseY - 8, W * 0.775, baseY + 5);
    c.closePath();
    c.fill();
  }

  function drawBirds(c) {
    c.save();
    c.strokeStyle = "rgba(30,12,40,0.9)";
    c.lineCap = "round";
    for (let i = 0; i < birds.length; i++) {
      let b = birds[i];
      b.x += b.sp * 0.016;
      if (b.x > 1.12) b.x = -0.12;
      let bx = b.x * W;
      let by = b.y * H + Math.sin(t * 0.5 + b.ph) * 6;
      let flap = Math.sin(t * 5.2 + b.ph * 2) * 4 * b.s;
      let w = 9 * b.s;
      c.lineWidth = 1.4 * b.s;
      c.beginPath();
      c.moveTo(bx - w, by - flap);
      c.quadraticCurveTo(bx - w * 0.4, by + 2, bx, by);
      c.quadraticCurveTo(bx + w * 0.4, by + 2, bx + w, by - flap);
      c.stroke();
    }
    c.restore();
  }

  function frame(ts) {
    try {
      if (!lastTs) lastTs = ts;
      let dt = Math.min(0.05, (ts - lastTs) / 1000);
      lastTs = ts;
      t += dt;

      drawSky(octx);
      drawSun(octx);
      drawBirds(octx);
      drawRidges(octx);
      drawCactus(octx);

      ctx.clearRect(0, 0, W, H);
      let bandTop = Math.floor(horizon - 12);
      let bandBot = Math.min(H - 1, Math.floor(horizon + 16));

      if (bandTop > 0) {
        ctx.drawImage(off, 0, 0, off.width, bandTop * DPR, 0, 0, W, bandTop);
      }
      for (let y = bandTop; y < bandBot; y += 2) {
        let ph = y * 0.34 + t * 2.6;
        let dx = Math.sin(ph) * 1.5 + Math.sin(ph * 0.53) * 0.8;
        ctx.drawImage(
          off, 0, y * DPR, off.width, 2 * DPR,
          dx, y, W, 2
        );
      }
      let rem = bandBot;
      if (bandBot < H) {
        ctx.drawImage(off, 0, bandBot * DPR, off.width, off.height - bandBot * DPR, 0, bandBot, W, H - bandBot);
      }
    } catch (e) {
      return;
    }
    requestAnimationFrame(frame);
  }

  var sunEl = document.getElementById("sun");
  var sunVal = document.getElementById("sunval");
  sunEl.addEventListener("input", function () {
    sunA = Number(sunEl.value) / 100;
    sunVal.textContent = sunA.toFixed(2);
  });

  window.addEventListener("resize", fit);

  fit();
  sunA = Number(sunEl.value) / 100;
  sunVal.textContent = sunA.toFixed(2);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
