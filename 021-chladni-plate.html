<!DOCTYPE html>
<html lang="en">
<head>
<meta charset=utf-8>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chladni Plate — No. 021</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%}
body{background:#101114;overflow:hidden;font-family:Georgia,'Times New Roman',serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,2.6vh,24px);
  background-image:radial-gradient(120vmax 90vmax at 50% 42%,rgba(38,40,48,.34) 0%,rgba(16,17,20,0) 62%)}
.hud{width:min(64vmin,520px);display:flex;justify-content:space-between;align-items:baseline;
  padding:0 clamp(2px,1vw,8px)}
h1{font-weight:400;font-size:clamp(16px,3.4vw,26px);letter-spacing:clamp(.3em,.9vw,.55em);
  text-transform:uppercase;color:#d8d2c4;text-shadow:0 0 18px rgba(212,175,55,.18)}
.readout{font-style:italic;font-size:clamp(12px,2.4vw,18px);letter-spacing:.14em;color:#c9a86a}
.frame{width:min(64vmin,520px);aspect-ratio:1/1;padding:12px;position:relative;
  border:12px solid #8a6a2f;border-radius:6px;
  box-shadow:inset 0 0 0 1px #5c451e,inset 0 0 22px rgba(0,0,0,.75),inset 1px 1px 0 rgba(230,205,140,.25),
  0 24px 60px rgba(0,0,0,.65),0 0 0 1px rgba(212,175,55,.12)}
.screw{position:absolute;width:9px;height:9px;border-radius:50%;z-index:2;
  background:radial-gradient(circle at 35% 30%,#e8d39a,#8a6a2f 58%,#3f2f10);
  box-shadow:0 1px 2px rgba(0,0,0,.8),inset 0 0 1px rgba(0,0,0,.9)}
.s1{left:5px;top:5px}.s2{right:5px;top:5px}.s3{left:5px;bottom:5px}.s4{right:5px;bottom:5px}
#plate{display:block;width:100%;height:100%;border-radius:2px}
.veil{position:absolute;inset:12px;pointer-events:none;z-index:1;border-radius:2px;
  box-shadow:inset 0 0 34px rgba(0,0,0,.55),inset 0 2px 6px rgba(0,0,0,.5)}
.panel{width:min(64vmin,520px);background:rgba(22,23,27,.82);
  border:1px solid rgba(212,175,55,.2);border-radius:14px;
  box-shadow:0 14px 34px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.05);
  padding:clamp(12px,2.4vh,18px) clamp(14px,3vw,22px);display:flex;flex-direction:column;gap:9px}
.row{display:grid;grid-template-columns:88px 1fr 48px;align-items:center;gap:12px}
.row label{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;
  letter-spacing:.24em;text-transform:uppercase;color:#9a8f74}
.row output{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#d4af37;
  text-align:right;letter-spacing:.08em}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:22px;width:100%;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:rgba(212,175,55,.22)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5.5px;
  border-radius:50%;background:radial-gradient(circle at 35% 30%,#ecd9a4,#8a6a2f 72%);
  box-shadow:0 1px 5px rgba(0,0,0,.65),0 0 8px rgba(212,175,55,.25)}
input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:rgba(212,175,55,.22)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ecd9a4,#8a6a2f 72%);box-shadow:0 1px 5px rgba(0,0,0,.65)}
.caption{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:clamp(8px,1.2vw,11px);
  letter-spacing:.4em;text-transform:uppercase;color:rgba(201,168,106,.45)}
@media (max-height:640px){.panel{gap:6px;padding:10px 14px}}
.status{margin-top:2px;display:flex;justify-content:space-between;font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:#6f6549}
.status b{color:#d4af37;font-weight:400}
.status .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:7px;
  background:#d4af37;box-shadow:0 0 8px rgba(212,175,55,.7);animation:pulse 1.4s ease-in-out infinite;vertical-align:1px}
.status.calm .dot{animation:none;background:#6f6549;box-shadow:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
</style>
</head>
<body>
<header class="hud">
  <h1>Chladni Plate</h1>
  <p class="readout">PATTERN <span id="pat">5.7</span></p>
</header>

<div class="frame" id="frame">
  <span class="screw s1"></span><span class="screw s2"></span>
  <span class="screw s3"></span><span class="screw s4"></span>
  <canvas id="plate"></canvas>
  <div class="veil"></div>
</div>

<div class="panel">
  <div class="row">
    <label for="n">Mode n</label>
    <input type="range" id="n" min="1" max="12" step="1" value="5" aria-label="mode n">
    <output id="nval">5</output>
  </div>
  <div class="row">
    <label for="m">Mode m</label>
    <input type="range" id="m" min="1" max="12" step="1" value="7" aria-label="mode m">
    <output id="mval">7</output>
  </div>
  <div class="row">
    <label for="count">Grains</label>
    <input type="range" id="count" min="2000" max="10000" step="500" value="9000" aria-label="grain count">
    <output id="cval">9.0k</output>
  </div>
</div>

<p class="caption">No. 021 — Chladni Plate</p>
<script>
(function(){
"use strict";
var GOLD_RES=240;
var PI=Math.PI;
var MAXC=10000;
var K2=0.003,J0=0.005;

var plate=document.getElementById('plate');
var frameEl=document.getElementById('frame');
var ctx=plate.getContext('2d');
var grainCanvas=document.createElement('canvas');
var gctx=grainCanvas.getContext('2d');
var goldCanvas=document.createElement('canvas');
goldCanvas.width=GOLD_RES;goldCanvas.height=GOLD_RES;
var pctx=goldCanvas.getContext('2d');

var nEl=document.getElementById('n');
var mEl=document.getElementById('m');
var cEl=document.getElementById('count');
var nVal=document.getElementById('nval');
var mVal=document.getElementById('mval');
var cVal=document.getElementById('cval');
var patEl=document.getElementById('pat');

var U=new Float32Array(MAXC);
var V=new Float32Array(MAXC);
var n=5,m=7,count=9000;
var dev=0,DPR=1,buf=null,buf32=null;
var heatAge=0,cursor=0,budget=count,lastStepMs=6;
var lastNow=performance.now();

function seed(){
  for(var i=0;i<count;i++){U[i]=Math.random();V[i]=Math.random();}
  cursor=0;budget=count;lastStepMs=6;
}
function heat(){heatAge=0;}

function renderGold(){
  var img=pctx.createImageData(GOLD_RES,GOLD_RES);
  var d=new Uint32Array(img.data.buffer);
  var na=PI*n,mb=PI*m,th=0.07*0.07;
  for(var y=0;y<GOLD_RES;y++){
    var cv=Math.cos(mb*(y+0.5)/GOLD_RES);
    var base=y*GOLD_RES;
    for(var x=0;x<GOLD_RES;x++){
      var f=cv*Math.cos(na*(x+0.5)/GOLD_RES);
      if(f*f<th){d[base+x]=0x33D4AF37;}
    }
  }
  pctx.putImageData(img,0,0);
}

function fit(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  var css=frameEl.clientWidth-24;
  dev=Math.max(96,Math.round(css*DPR));
  plate.width=dev;plate.height=dev;
  grainCanvas.width=dev;grainCanvas.height=dev;
  buf=gctx.createImageData(dev,dev);
  buf32=new Uint32Array(buf.data.buffer);
}

function stepGrains(){
  var t0=performance.now();
  var j=J0*Math.exp(-heatAge/3.2);
  var na=PI*n,mb=PI*m;
  for(var k=0;k<budget;k++){
    var i=(cursor+k)%count;
    var u=U[i],v=V[i];
    var au=na*u,bv=mb*v;
    var cu=Math.cos(au),su=Math.sin(au);
    var cv=Math.cos(bv),sv=Math.sin(bv);
    var f=cu*cv;
    u+=K2*f*na*su*cv+(Math.random()-0.5)*j;
    v+=K2*f*mb*cu*sv+(Math.random()-0.5)*j;
    if(u<0.0005){u=0.0005;}else if(u>0.9995){u=0.9995;}
    if(v<0.0005){v=0.0005;}else if(v>0.9995){v=0.9995;}
    U[i]=u;V[i]=v;
  }
  return performance.now()-t0;
}

function drawGrains(){
  buf32.fill(0);
  for(var i=0;i<count;i++){
    var x=Math.round(U[i]*dev);if(x>=dev){x=dev-1;}
    var y=Math.round(V[i]*dev);if(y>=dev){y=dev-1;}
    buf32[y*dev+x]=0xFFDDD6CF;
  }
  gctx.putImageData(buf,0,0);
}

function loop(now){
  requestAnimationFrame(loop);
  try{
    if(dev<96){fit();}
    var dt=(now-lastNow)/1000;lastNow=now;
    if(!(dt>0)||dt>0.1){dt=0.016;}
    heatAge+=dt;
    var ms=stepGrains();
    cursor=(cursor+budget)%count;
    if(ms>16){budget=Math.max(count>>2,Math.floor(count*12/ms));}
    else if(ms<9&&budget<count){budget=count;}
    drawGrains();
    ctx.setTransform(1,0,0,1,0,0);
    ctx.imageSmoothingEnabled=true;
    ctx.fillStyle='#101114';
    ctx.fillRect(0,0,dev,dev);
    ctx.drawImage(goldCanvas,0,0,dev,dev);
    ctx.imageSmoothingEnabled=false;
    ctx.drawImage(grainCanvas,0,0);
  }catch(e){/* guard: never let a frame kill the loop */}
}

function fmtK(v){return (v/1000).toFixed(1)+'k';}

nEl.addEventListener('input',function(){
  n=+nEl.value;nVal.textContent=String(n);patEl.textContent=n+'.'+m;
  renderGold();heat();
});
mEl.addEventListener('input',function(){
  m=+mEl.value;mVal.textContent=String(m);patEl.textContent=n+'.'+m;
  renderGold();heat();
});
cEl.addEventListener('input',function(){
  count=+cEl.value;cVal.textContent=fmtK(count);
  seed();heat();
});

window.addEventListener('resize',fit);

seed();
renderGold();
fit();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
