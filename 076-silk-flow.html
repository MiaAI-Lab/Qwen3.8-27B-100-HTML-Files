<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>26 Silk — Flow Field Ribbons</title>
<style>
  :root{
    --bg:#141018;
    --ink:#f5ead8;
    --dim:rgba(245,234,216,.42);
    --line:rgba(245,234,216,.16);
    --chip:rgba(245,234,216,.07);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:radial-gradient(120% 90% at 50% 8%, #1b1420 0%, #141018 52%, #0e0b11 100%);
    overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
  .hud{
    position:fixed;left:0;right:0;
    display:flex;flex-direction:column;align-items:center;
    gap:14px;pointer-events:none;user-select:none;
  }
  .top{top:clamp(14px,3vh,30px)}
  .bottom{bottom:clamp(14px,3.5vh,32px);align-items:flex-end}
  .caption{
    font-size:11px;letter-spacing:.42em;text-transform:uppercase;
    color:var(--ink);
    padding:10px 22px 9px;
    border:1px solid var(--line);
    background:rgba(20,16,24,.55);
    backdrop-filter:blur(6px);
    border-radius:2px;
    display:flex;align-items:baseline;gap:14px;
  }
  .caption .num{color:var(--dim);letter-spacing:.3em;font-size:10px}
  .row{display:flex;gap:10px;align-items:center;pointer-events:auto}
  .chip{
    appearance:none;cursor:pointer;
    font:inherit;font-size:10px;letter-spacing:.3em;text-transform:uppercase;
    color:var(--dim);
    background:var(--chip);
    border:1px solid var(--line);
    border-radius:2px;
    padding:9px 18px 8px;
    transition:color .35s ease,border-color .35s ease,background .35s ease,transform .35s ease;
  }
  .chip:hover{color:var(--ink);transform:translateY(-1px)}
  .chip.on{
    color:var(--ink);
    background:rgba(245,234,216,.14);
    border-color:rgba(245,234,216,.55);
    box-shadow:0 0 18px rgba(232,193,90,.12) inset;
  }
  .restart{
    appearance:none;cursor:pointer;
    font:inherit;font-size:10px;letter-spacing:.3em;text-transform:uppercase;
    color:var(--ink);
    background:transparent;
    border:1px solid rgba(232,193,90,.4);
    border-radius:2px;
    padding:9px 18px 8px;
    transition:background .35s ease,border-color .35s ease;
  }
  .restart:hover{background:rgba(232,193,90,.12);border-color:rgba(232,193,90,.8)}
  .hint{
    position:fixed;left:16px;bottom:16px;
    font-size:9px;letter-spacing:.28em;text-transform:uppercase;
    color:rgba(245,234,216,.22);user-select:none;pointer-events:none;
  }
  @media (max-width:480px){
    .caption{font-size:9px;letter-spacing:.3em;padding:8px 14px 7px}
    .chip{padding:8px 12px 7px}
  }
</style>
</head>
<body>
<canvas id="stage" aria-label="Silk flow ribbons"></canvas>

<div class="hud top">
  <div class="caption">
    <span class="num">Gallery 100 / 076</span>
    <span id="cap">26 SILK - FLOW 0.4</span>
  </div>
</div>

<div class="hud bottom">
  <div class="row" id="speedRow" role="group" aria-label="Speed">
    <button class="chip" data-speed="sleek">Sleek</button>
    <button class="chip on" data-speed="flow">Flow</button>
    <button class="chip" data-speed="gale">Gale</button>
    <button class="restart" id="restart">Restart</button>
  </div>
</div>

<div class="hint">Move the pointer to warp the silk</div>

<script>
(function(){
  "use strict";

  var canvas = document.getElementById("stage");
  var ctx = canvas.getContext("2d");
  var cap = document.getElementById("cap");
  var restartBtn = document.getElementById("restart");
  var chips = Array.prototype.slice.call(document.querySelectorAll("#speedRow .chip"));

  /* ---- palette: rose, gold, violet, teal, coral, champagne ---- */
  var COLORS = [
    [244,115,158],
    [232,193,90],
    [157,123,216],
    [53,184,168],
    [255,127,92],
    [236,217,168]
  ];

  /* ---- speed chips ---- */
  var SPEEDS = { sleek:0.20, flow:0.40, gale:1.60 };
  var speedName = "flow";
  var speedMult = SPEEDS.flow;

  var RIBBON_COUNT = 26;
  var SEGMENTS = 60;
  var BASE_SPEED = 12;   /* px per second at mult 1.0 */
  var VORTEX_RADIUS = 200;

  var W = 0, H = 0, DPR = 1;

  var ribbons = [];
  var pointer = { x:-9999, y:-9999, on:false };
  var lastT = 0;

  function fit(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  /* ---- 2-octave value noise (slowly evolving via time offset) ---- */
  function hash2(ix, iy){
    var n = ix * 15731 + iy * 7919;
    n = (n << 13) ^ n;
    n = n * (n * n * 15731 + 789221) + 1376312589;
    return (n & 0x7fffffff) / 0x7fffffff;
  }
  function smooth(t){ return t * t * (3 - 2 * t); }
  function vnoise(x, y){
    var ix = Math.floor(x), iy = Math.floor(y);
    var fx = x - ix, fy = y - iy;
    var a = hash2(ix, iy), b = hash2(ix + 1, iy);
    var c = hash2(ix, iy + 1), d = hash2(ix + 1, iy + 1);
    var ux = smooth(fx), uy = smooth(fy);
    return (a + (b - a) * ux) + ((c + (d - c) * ux) - (a + (b - a) * ux)) * uy;
  }
  function potential(x, y, t){
    return vnoise(x * 0.0016 + t * 0.045, y * 0.0016 - t * 0.032) * 1.0
         + vnoise(x * 0.0041 - t * 0.021, y * 0.0041 + t * 0.058) * 0.5;
  }
  /* curl of a scalar potential -> divergence-free flow direction */
  function flowAngle(x, y, t){
    var e = 2;
    var dx = potential(x + e, y, t) - potential(x - e, y, t);
    var dy = potential(x, y + e, t) - potential(x, y - e, t);
    return Math.atan2(-dx, dy);
  }

  function spawnRibbon(i){
    var pts = [];
    var x = Math.random() * W;
    var y = Math.random() * H;
    for(var s = 0; s < SEGMENTS; s++){
      pts.push({ x: x + (Math.random() - 0.5) * 20, y: y + (Math.random() - 0.5) * 20 });
    }
    ribbons.push({
      pts: pts,
      color: COLORS[i % COLORS.length],
      speedVar: 0.7 + Math.random() * 0.6,
      phase: Math.random() * 1000
    });
  }

  function respawnAll(){
    ribbons.length = 0;
    for(let i = 0; i < RIBBON_COUNT; i++){ spawnRibbon(i); }
  }

  function update(dt, t){
    var follow = Math.min(1, dt * 14);
    for(let r = 0; r < ribbons.length; r++){
      var rib = ribbons[r];
      var head = rib.pts[0];
      var ang = flowAngle(head.x, head.y, t + rib.phase * 0.001);
      var sp = BASE_SPEED * speedMult * rib.speedVar;
      var nx = head.x + Math.cos(ang) * sp * dt;
      var ny = head.y + Math.sin(ang) * sp * dt;

      /* pointer vortex warp within 200px */
      if(pointer.on){
        var pdx = head.x - pointer.x;
        var pdy = head.y - pointer.y;
        var pd = Math.sqrt(pdx * pdx + pdy * pdy);
        if(pd < VORTEX_RADIUS && pd > 0.001){
          var fall = 1 - pd / VORTEX_RADIUS;
          var tx = -pdy / pd, ty = pdx / pd;
          nx += tx * 120 * fall * dt;
          ny += ty * 120 * fall * dt;
        }
      }

      /* wrap the whole ribbon rigidly when the head exits */
      var ox = 0, oy = 0;
      if(nx < -30){ nx += W + 60; ox = W + 60; }
      else if(nx > W + 30){ nx -= W + 60; ox = -(W + 60); }
      if(ny < -30){ ny += H + 60; oy = H + 60; }
      else if(ny > H + 30){ ny -= H + 60; oy = -(H + 60); }

      head.x = nx;
      head.y = ny;
      for(let s = 1; s < SEGMENTS; s++){
        var p = rib.pts[s];
        var q = rib.pts[s - 1];
        if(ox !== 0 || oy !== 0){
          /* after a wrap the segment behind the head would draw across the
             screen; slide the whole tail so it stays contiguous */
          p.x += ox; p.y += oy;
          p.x += (q.x - p.x) * follow;
          p.y += (q.y - p.y) * follow;
        } else {
          p.x += (q.x - p.x) * follow;
          p.y += (q.y - p.y) * follow;
        }
      }
    }
  }

  function draw(){
    ctx.globalCompositeOperation = "source-over";
    /* soft veil instead of hard clear keeps trailing glow silky */
    ctx.fillStyle = "rgba(20,16,24,0.28)";
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = "lighter";
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    for(let r = 0; r < ribbons.length; r++){
      var rib = ribbons[r];
      var c = rib.color;
      for(let s = 0; s < SEGMENTS - 1; s++){
        var p0 = rib.pts[s], p1 = rib.pts[s + 1];
        var w = 6 * (1 - s / SEGMENTS);
        if(w < 0.35) continue;
        ctx.strokeStyle = "rgba(" + c[0] + "," + c[1] + "," + c[2] + ",0.5)";
        ctx.lineWidth = w;
        ctx.beginPath();
        ctx.moveTo(p0.x, p0.y);
        ctx.lineTo(p1.x, p1.y);
        ctx.stroke();
      }
    }
    ctx.globalCompositeOperation = "source-over";
  }

  function frame(now){
    try{
      var t = now * 0.001;
      var dt = Math.min(0.05, (now - lastT) * 0.001 || 0.016);
      lastT = now;
      update(dt, t);
      draw();
    }catch(err){ /* never let one bad frame kill the loop */ }
    requestAnimationFrame(frame);
  }

  function setSpeed(name){
    speedName = name;
    speedMult = SPEEDS[name] || SPEEDS.flow;
    cap.textContent = "26 SILK - " + speedName.toUpperCase() + " " + speedMult.toFixed(1);
    for(let i = 0; i < chips.length; i++){
      chips[i].classList.toggle("on", chips[i].getAttribute("data-speed") === name);
    }
  }

  for(let i = 0; i < chips.length; i++){
    (function(chip){
      chip.addEventListener("click", function(){ setSpeed(chip.getAttribute("data-speed")); });
    })(chips[i]);
  }
  restartBtn.addEventListener("click", function(){ respawnAll(); });

  canvas.addEventListener("pointermove", function(e){
    pointer.x = e.clientX; pointer.y = e.clientY; pointer.on = true;
  });
  canvas.addEventListener("pointerleave", function(){ pointer.on = false; });
  window.addEventListener("resize", fit);

  /* boot */
  fit();
  setSpeed("flow");
  respawnAll();
  ctx.fillStyle = "#141018";
  ctx.fillRect(0, 0, W, H);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
