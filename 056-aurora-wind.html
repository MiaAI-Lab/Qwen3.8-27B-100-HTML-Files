<!DOCTYPE html>
<html lang="en">
<head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>056 · Aurora Response</title>
<style>
  *{margin:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#060913}
  #stage{position:relative;width:100vw;height:100dvh;background:
    radial-gradient(ellipse at 50% 120%,#0b1428 0%,#070b1a 45%,#060913 100%)}
  canvas{position:absolute;inset:0;display:block}
  #cap{position:absolute;left:20px;bottom:18px;z-index:5;
    font:600 11px/1.6 system-ui,sans-serif;letter-spacing:.22em;color:#7fd4ff;
    text-transform:uppercase;pointer-events:none;text-shadow:0 0 12px rgba(70,255,158,.35)}
  #cap b{font-weight:700;color:#baf5d8;letter-spacing:.14em}
  #kp{position:absolute;top:16px;right:18px;z-index:5;text-align:right;pointer-events:none}
  #kp .lbl{font:600 9px/1 system-ui,sans-serif;letter-spacing:.3em;color:#5b6f92;text-transform:uppercase}
  #kp .val{font:700 clamp(26px,4.5vw,40px)/1.1 system-ui,sans-serif;color:#46ff9e;
    letter-spacing:.04em;text-shadow:0 0 18px rgba(70,255,158,.55)}
  #kp .bar{margin-top:6px;width:140px;height:3px;background:#141d33;border-radius:2px;overflow:hidden}
  #kp .fill{height:100%;width:20%;background:linear-gradient(90deg,#27d3f2,#46ff9e);
    border-radius:2px;transition:width .18s ease}
  #hint{position:absolute;left:20px;top:18px;font:400 10px/1.7 system-ui,sans-serif;
    letter-spacing:.16em;color:#4a5a78;text-transform:uppercase;pointer-events:none}
</style>
</head>
<body>
<div id="stage">
  <canvas id="sky"></canvas>
  <div id="hint">move to stir the solar wind · flick for a Kp spike · hold still to relax</div>
  <div id="kp"><div class="lbl">Planetary Kp Index</div><div class="val" id="kpval">2.0</div><div class="bar"><div class="fill" id="kpfill"></div></div></div>
  <div id="cap">AURORA / RESPONSE · KP <b id="kplive">2.0</b></div>
</div>
<script>
(function(){
  "use strict";
  var cv=document.getElementById("sky"),ctx=cv.getContext("2d");
  var kpEl=document.getElementById("kpval"),kpfEl=document.getElementById("kpfill"),kplEl=document.getElementById("kplive");
  var W=0,H=0,dpr=1,lastTs=0,kp=2.0;
  var stars=[];
  var pointer={x:-9999,y:-9999,vx:0,vy:0,speed:0,active:false,stillT:0};

  function fit(){
    dpr=Math.min(2,window.devicePixelRatio||1);
    W=window.innerWidth;H=window.innerHeight;
    cv.width=Math.max(1,Math.round(W*dpr));cv.height=Math.max(1,Math.round(H*dpr));
    cv.style.width=W+"px";cv.style.height=H+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
    stars=[];
    for(var i=0;i<140;i++){
      stars.push({x:Math.random()*W,y:Math.random()*H*0.82,r:Math.random()*1.1+0.3,
        tw:Math.random()*6.28,ts:0.5+Math.random()*1.5});
    }
  }

  function hash(x,y){var s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s);}
  function vnoise(x,y){
    var ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;
    var sx=fx*fx*(3-2*fx),sy=fy*fy*(3-2*fy);
    var a=hash(ix,iy),b=hash(ix+1,iy),c=hash(ix,iy+1),d=hash(ix+1,iy+1);
    return a+(b-a)*sx+(c-a)*sy+(a-b-c+d)*sx*sy;
  }
  function fbm(x,y){return 0.6*vnoise(x,y)+0.4*vnoise(x*2.17+53.1,y*2.17+11.9);}

  var CURTAINS=[
    {base:0.18,amp:0.14,seg:120,ph:0.0,w:0.16,cols:["#46ff9e","#27d3f2","#8a7dff"]},
    {base:0.34,amp:0.12,seg:120,ph:1.9,w:0.20,cols:["#27d3f2","#46ff9e","#8a7dff"]},
    {base:0.55,amp:0.16,seg:120,ph:3.7,w:0.15,cols:["#8a7dff","#46ff9e","#27d3f2"]},
    {base:0.72,amp:0.11,seg:120,ph:5.2,w:0.19,cols:["#46ff9e","#8a7dff","#27d3f2"]}
  ];

  function hex(h){
    return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  }
  var RGB=CURTAINS.map(function(c){return c.cols.map(hex);});

  function mixA(c1,c2,t){
    return [c1[0]+(c2[0]-c1[0])*t|0, c1[1]+(c2[1]-c1[1])*t|0, c1[2]+(c2[2]-c1[2])*t|0];
  }
  function rgba(c,a){
    return "rgba("+c[0]+","+c[1]+","+c[2]+","+a+")";
  }

  function pointerInfluence(x){
    var dx=x-pointer.x,dy=0,dist=Math.abs(dx);
    if(dist>260)return 0;
    var f=1-dist/260;
    return f*f*(0.35+Math.min(1,pointer.speed*0.004));
  }

  function drawCurtain(ci,t){
    var C=CURTAINS[ci];
    var pts=[];
    var n=C.seg;
    for(var i=0;i<=n;i++){
      var u=i/n;
      var x=u*W;
      var field=fbm(u*2.4+t*0.13+C.ph, 7.3+t*0.07);
      var wave=Math.sin(u*Math.PI*2.6+t*0.55+C.ph*1.7);
      var py=(C.base+(field-0.5)*C.amp+wave*0.035)*H;
      var inf=pointerInfluence(x);
      py-=inf*H*0.10*Math.sin(u*9+t*2.2);
      var len=(0.20+0.10*fbm(u*3.1+4.2,t*0.19+C.ph)+inf*0.12)*H;
      pts.push({x:x,y:py,len:len,inf:inf,u:u});
    }
    for(var s=0;s<n;s++){
      var a=pts[s],b=pts[s+1];
      var top=Math.min(a.y,b.y)-4;
      var botA=a.y+a.len,botB=b.y+b.len;
      var mid=(botA+botB)/2;
      var g=ctx.createLinearGradient(0,top,0,mid);
      var bright=0.30+a.inf*0.55+((kp-2)/7)*0.18;
      var r1=RGB[ci][0],r2=RGB[ci][1],r3=RGB[ci][2];
      g.addColorStop(0,rgba(RGB[ci][2],0));
      g.addColorStop(0.18,rgba(mixA(RGB[ci][1],RGB[ci][2],0.5),bright*0.55));
      g.addColorStop(0.5,rgba(mixA(RGB[ci][0],RGB[ci][1],0.4),bright*0.85));
      g.addColorStop(1,rgba(RGB[ci][0],0));
      ctx.fillStyle=g;
      ctx.beginPath();
      ctx.moveTo(a.x,top);
      ctx.lineTo(b.x,top-2);
      ctx.lineTo(b.x,botB+14);
      ctx.lineTo(a.x,botA+14);
      ctx.closePath();
      ctx.fill();
      if(a.inf>0.02){
        ctx.fillStyle="rgba("+r1[0]+","+r1[1]+","+r1[2]+","+(a.inf*0.10).toFixed(3)+")";
        ctx.beginPath();
        ctx.arc(a.x,a.y-a.len*0.4,40+a.inf*50,0,6.283);
        ctx.fill();
      }
    }
  }

  function drawSky(t){
    var g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,"#04060f");
    g.addColorStop(0.55,"#060913");
    g.addColorStop(1,"#0a1120");
    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H);
    for(var i=0;i<stars.length;i++){
      var st=stars[i];
      var a=0.35+0.55*Math.abs(Math.sin(t*st.ts+st.tw));
      ctx.fillStyle="rgba(220,232,255,"+a.toFixed(3)+")";
      ctx.beginPath();ctx.arc(st.x,st.y,st.r,0,6.283);ctx.fill();
    }
    ctx.globalCompositeOperation="lighter";
    var fl=(kp-2)/7;
    if(fl>0.02){
      var fg=ctx.createRadialGradient(W*0.5,H*0.1,0,W*0.5,H*0.1,W*0.7);
      fg.addColorStop(0,"rgba(70,255,158,"+(fl*0.14).toFixed(3)+")");
      fg.addColorStop(1,"rgba(70,255,158,0)");
      ctx.fillStyle=fg;ctx.fillRect(0,0,W,H);
    }
    for(var c=0;c<4;c++)drawCurtain(c,t);
    ctx.globalCompositeOperation="source-over";
  }

  function drawGround(){
    var gy=H*0.85;
    var g=ctx.createLinearGradient(0,gy,0,H);
    g.addColorStop(0,"#0d1526");
    g.addColorStop(1,"#04060c");
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.moveTo(0,gy+14);
    for(var i=0;i<=12;i++){
      var u=i/12;
      ctx.lineTo(u*W,gy+14+Math.sin(u*5.2+0.7)*7+Math.sin(u*11.3)*4);
    }
    ctx.lineTo(W,H);ctx.lineTo(0,H);
    ctx.closePath();ctx.fill();
    var rg=ctx.createLinearGradient(0,gy-30,0,gy+60);
    rg.addColorStop(0,"rgba(70,255,158,0)");
    rg.addColorStop(0.5,"rgba(70,255,158,"+(0.05+((kp-2)/7)*0.10).toFixed(3)+")");
    rg.addColorStop(1,"rgba(70,255,158,0)");
    ctx.fillStyle=rg;
    ctx.fillRect(0,gy-30,W,90);
    for(var s=0;s<40;s++){
      var x=(s*73.7)%(W),y=gy+20+((s*37.3)%(H-gy-22));
      ctx.fillStyle="rgba(210,225,245,0.5)";
      ctx.fillRect(x,y,1.4,1.4);
    }
  }

  function updateKp(dt){
    kp+=Math.min(0.9,pointer.speed*dt*0.004);
    if(pointer.active&&pointer.stillT>2.5)kp-=dt*0.5;
    if(!pointer.active)kp-=dt*0.8;
    if(kp<0.8)kp-=dt*0.4;
    kp=Math.max(0.5,Math.min(9,kp));
  }
  var kpTimer=0;
  function updateKpUI(){
    var v=kp.toFixed(1);
    kpEl.textContent=v;kplEl.textContent=v;
    kpfEl.style.width=(kp/9*100).toFixed(1)+"%";
    kpEl.style.color=kp>6?"#46ff9e":(kp>3.5?"#7fffd4":"#8fa8c8");
  }

  var stage=document.getElementById("stage");
  stage.addEventListener("pointermove",function(e){
    var nx=e.clientX,ny=e.clientY;
    if(pointer.active){
      var t=performance.now()/1000;
      pointer.vx=nx-pointer.x;pointer.vy=ny-pointer.y;
      pointer.speed=Math.hypot(pointer.vx,pointer.vy)/Math.max(0.016,t*0+0.016);
    }
    pointer.x=nx;pointer.y=ny;pointer.active=true;
  });
  stage.addEventListener("pointerleave",function(){pointer.active=false;pointer.speed=0;pointer.x=-9999;pointer.y=-9999;});
  stage.addEventListener("pointerdown",function(e){pointer.x=e.clientX;pointer.y=e.clientY;pointer.active=true;});

  var lastPX=-9999,lastPY=-9999;
  window.addEventListener("resize",fit);
  fit();

  function frame(ts){
    requestAnimationFrame(frame);
    try{
      var dt=Math.min(0.05,(ts-lastTs)/1000||0.016);
      lastTs=ts;
      var t=ts*0.001;
      if(pointer.active&&lastPX!==-9999){
        pointer.vx=(pointer.x-lastPX);pointer.vy=(pointer.y-lastPY);
        pointer.speed=Math.hypot(pointer.vx,pointer.vy)/Math.max(0.008,dt);
      }
      lastPX=pointer.x;lastPY=pointer.y;
      if(pointer.active){
        pointer.stillT=pointer.speed<40?pointer.stillT+dt:0;
      }else{
        pointer.stillT=0;
      }
      pointer.vx*=0.9;pointer.vy*=0.9;
      updateKp(dt);
      drawSky(t);
      drawGround();
      kpTimer+=dt;
      if(kpTimer>0.12){kpTimer=0;updateKpUI();}
    }catch(err){}
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
