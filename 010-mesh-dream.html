<!DOCTYPE html>
<html lang="en">
<head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width, initial-scale=1">
<title>Dreammesh — gradient dreamscape</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:#140a2e;
  overflow:hidden;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  touch-action:none;
}
#sky{
  position:fixed;inset:0;
  width:100%;height:100%;
  display:block;
}
/* ---- wordmark, lower left ---- */
.mark{
  position:fixed;left:clamp(18px,4vw,40px);bottom:clamp(18px,4vh,36px);
  z-index:5;pointer-events:none;
}
.mark .eyebrow{
  font-size:9px;letter-spacing:.42em;text-transform:uppercase;
  color:rgba(233,226,255,.42);font-weight:500;
}
.mark h1{
  margin-top:9px;
  font-size:clamp(17px,2.6vw,26px);
  font-weight:200;letter-spacing:.55em;
  color:rgba(244,240,255,.92);
  text-shadow:0 0 24px rgba(124,107,255,.35);
}
.mark .hint{
  margin-top:10px;font-size:9px;letter-spacing:.24em;text-transform:uppercase;
  color:rgba(233,226,255,.38);
  transition:opacity 1.2s ease;
}
.mark .hint.seen{opacity:.18}
/* ---- glass pill nav ---- */
#pill{
  position:fixed;left:50%;bottom:clamp(18px,4vh,34px);
  transform:translateX(-50%);
  z-index:6;
  display:flex;align-items:center;gap:7px;
  padding:9px 13px;
  border-radius:999px;
  background:rgba(255,255,255,.075);
  border:1px solid rgba(255,255,255,.17);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  box-shadow:0 22px 48px -20px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.12);
}
.chip{
  width:28px;height:28px;border-radius:50%;
  border:1px solid rgba(255,255,255,.25);
  cursor:pointer;
  transition:transform .28s cubic-bezier(.2,1.6,.4,1),box-shadow .28s ease;
  -webkit-tap-highlight-color:transparent;
}
.chip:nth-child(1){background:radial-gradient(circle at 35% 30%,#ffd6f2,#ff9de2 52%,rgba(255,157,226,.22) 78%)}
.chip:nth-child(2){background:radial-gradient(circle at 35% 30%,#c3bbff,#7c6bff 52%,rgba(124,107,255,.22) 78%)}
.chip:nth-child(3){background:radial-gradient(circle at 35% 30%,#c4fff2,#4ff0d4 52%,rgba(79,240,212,.22) 78%)}
.chip:nth-child(4){background:radial-gradient(circle at 35% 30%,#ffefc2,#ffd76f 52%,rgba(255,215,111,.22) 78%)}
.chip:nth-child(5){background:radial-gradient(circle at 35% 30%,#9db3ff,#274bff 52%,rgba(39,75,255,.22) 78%)}
.chip:hover{transform:scale(1.12)}
.chip.on{
  transform:scale(1.2);
  box-shadow:0 0 0 2px rgba(255,255,255,.6),0 0 22px rgba(255,255,255,.28);
}
@media(max-width:380px){
  #pill{gap:5px;padding:8px 10px}
  .chip{width:24px;height:24px}
  .mark h1{letter-spacing:.4em}
}
</style>
</head>
<body>
<canvas id="sky"></canvas>

<div class="mark" aria-hidden="true">
  <div class="eyebrow">010 · Gradient Dreamscape</div>
  <h1>DREAMMESH</h1>
  <div class="hint" id="hint">touch a colour — the dream follows</div>
</div>

<nav id="pill" aria-label="orb focus">
  <button class="chip" data-i="0" aria-label="focus pink orb"></button>
  <button class="chip" data-i="1" aria-label="focus violet orb"></button>
  <button class="chip" data-i="2" aria-label="focus teal orb"></button>
  <button class="chip" data-i="3" aria-label="focus gold orb"></button>
  <button class="chip" data-i="4" aria-label="focus blue orb"></button>
</nav>

<script>
(function () {
  'use strict';
  const cvs = document.getElementById('sky');
  const ctx = cvs.getContext('2d');
  const chips = Array.prototype.slice.call(document.querySelectorAll('.chip'));
  const hint = document.getElementById('hint');
  const TAU = Math.PI * 2;

  let W = 1, H = 1, DPR = 1;
  let t0 = null;
  let lastNow = 0;
  const pointer = { x: 0, y: 0, has: false };

  /* ---- palette + drift definition ---- */
  function hexToHsl(hex) {
    const r = parseInt(hex.slice(1, 3), 16) / 255;
    const g = parseInt(hex.slice(3, 5), 16) / 255;
    const b = parseInt(hex.slice(5, 7), 16) / 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    const l = (max + min) / 2;
    let h = 0, s = 0;
    if (max !== min) {
      const d = max - min;
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
      else if (max === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h *= 60;
    }
    return { h: h, s: s * 100, l: l * 100 };
  }

  const DEFS = [
    { hex: '#ff9de2', rad: 0.58, ax: 0.40, ay: 0.44, fx: 0.11, fy: 0.07, px: 0.0, py: 1.1, hue: 0 },
    { hex: '#7c6bff', rad: 0.72, ax: 0.44, ay: 0.38, fx: 0.07, fy: 0.12, px: 2.1, py: 0.4, hue: 42 },
    { hex: '#4ff0d4', rad: 0.50, ax: 0.36, ay: 0.50, fx: 0.10, fy: 0.05, px: 4.0, py: 2.6, hue: 84 },
    { hex: '#ffd76f', rad: 0.84, ax: 0.50, ay: 0.34, fx: 0.05, fy: 0.13, px: 1.2, py: 3.9, hue: 126 },
    { hex: '#274bff', rad: 0.64, ax: 0.42, ay: 0.48, fx: 0.09, fy: 0.10, px: 3.3, py: 5.2, hue: 168 }
  ];

  const orbs = DEFS.map(function (d, i) {
    const hsl = hexToHsl(d.hex);
    return {
      i: i,
      h0: hsl.h, s0: hsl.s, l0: hsl.l,
      x: W / 2, y: H / 2, vx: 0, vy: 0,
      focused: false, focus: 0,
      radPx: d.rad, axPx: d.ax, ayPx: d.ay,
      fx: d.fx, fy: d.fy, pxx: d.px, pyy: d.py, hueOff: d.hue
    };
  });

  function home(o, t) {
    return {
      x: W * 0.5 + Math.sin(t * o.fx + o.pxx) * o.axPx,
      y: H * 0.5 + Math.sin(t * o.fy + o.pyy) * o.ayPx
    };
  }

  function fit() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    cvs.width = Math.max(1, Math.round(W * DPR));
    cvs.height = Math.max(1, Math.round(H * DPR));
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    for (let i = 0; i < orbs.length; i++) {
      const o = orbs[i], d = DEFS[i];
      o.radPx = d.rad * W;
      o.axPx = d.ax * W * 0.5;
      o.ayPx = d.ay * H * 0.5;
    }
    if (t0 === null) {
      for (let i = 0; i < orbs.length; i++) {
        const h = home(orbs[i], 0);
        orbs[i].x = h.x;
        orbs[i].y = h.y;
      }
      pointer.x = W * 0.5;
      pointer.y = H * 0.35;
    }
  }

  function step(t, dt) {
    for (let i = 0; i < orbs.length; i++) {
      const o = orbs[i];
      const target = (o.focused && pointer.has) ? pointer : home(o, t);
      const k = o.focused ? 5.4 : 0.75;
      const c = 2 * Math.sqrt(k) * (o.focused ? 0.7 : 0.92);
      o.vx += ((target.x - o.x) * k - o.vx * c) * dt;
      o.vy += ((target.y - o.y) * k - o.vy * c) * dt;
      o.x += o.vx * dt;
      o.y += o.vy * dt;
      const ft = o.focused ? 1 : 0;
      o.focus += (ft - o.focus) * Math.min(1, dt * 5.5);
    }
  }

  function draw(t) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#140a2e';
    ctx.fillRect(0, 0, W, H);

    const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.22, W / 2, H / 2, Math.max(W, H) * 0.82);
    vg.addColorStop(0, 'rgba(24,12,54,0)');
    vg.addColorStop(1, 'rgba(5,2,15,0.62)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = 'screen';
    for (let i = 0; i < orbs.length; i++) {
      const o = orbs[i];
      const h = o.h0 + o.hueOff + t * 0.9 + Math.sin(t * 0.11 + o.i * 1.7) * 10;
      const r = o.radPx * (1 + o.focus * 0.14);
      const g = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, r);
      g.addColorStop(0, 'hsla(' + h + ',' + o.s0 + '%,' + o.l0 + '%,0.78)');
      g.addColorStop(0.4, 'hsla(' + h + ',' + o.s0 + '%,' + (o.l0 * 0.74) + '%,0.30)');
      g.addColorStop(1, 'hsla(' + h + ',' + o.s0 + '%,' + (o.l0 * 0.5) + '%,0)');
      ctx.fillStyle = g;
      ctx.fillRect(o.x - r, o.y - r, r * 2, r * 2);

      ctx.globalCompositeOperation = 'lighter';
      const rc = r * 0.34;
      const gc = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, rc);
      gc.addColorStop(0, 'hsla(' + h + ',' + Math.min(100, o.s0 + 8) + '%,' + Math.min(93, o.l0 + 18) + '%,0.26)');
      gc.addColorStop(1, 'hsla(' + h + ',' + o.s0 + '%,' + o.l0 + '%,0)');
      ctx.fillStyle = gc;
      ctx.fillRect(o.x - rc, o.y - rc, rc * 2, rc * 2);
      ctx.globalCompositeOperation = 'screen';
    }
  }

  let raf = 0;
  function frame(now) {
    raf = requestAnimationFrame(frame);
    try {
      if (t0 === null) { t0 = now; lastNow = now; }
      const dt = Math.min(0.034, Math.max(0.001, (now - lastNow) / 1000));
      lastNow = now;
      const t = (now - t0) / 1000;
      step(t, dt);
      draw(t);
    } catch (err) {
      cancelAnimationFrame(raf);
      if (window.console) console.warn('dreammesh frame halted', err);
    }
  }

  window.addEventListener('pointermove', function (e) {
    pointer.x = e.clientX;
    pointer.y = e.clientY;
    pointer.has = true;
  }, { passive: true });

  chips.forEach(function (chip) {
    chip.addEventListener('click', function () {
      const i = parseInt(chip.getAttribute('data-i'), 10);
      const o = orbs[i];
      const turningOn = !o.focused;
      for (let j = 0; j < orbs.length; j++) orbs[j].focused = false;
      if (turningOn) o.focused = true;
      for (let j = 0; j < chips.length; j++) chips[j].classList.toggle('on', orbs[j].focused);
      if (turningOn && hint) hint.classList.add('seen');
    });
  });

  window.addEventListener('resize', fit);
  fit();
  raf = requestAnimationFrame(frame);
})();
</script>
</body>
</html>
