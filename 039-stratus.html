<!DOCTYPE html>
<html lang="en">
<head>
<meta charset=utf-8>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stratus — 039</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #101a2e;
    overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #wrap {
    position: fixed;
    inset: 0;
    height: 100dvh;
    width: 100vw;
  }
  #sky { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .hud {
    position: fixed;
    top: clamp(10px, 2.2vw, 22px);
    left: clamp(12px, 2.6vw, 28px);
    right: clamp(12px, 2.6vw, 28px);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    z-index: 2;
  }
  .name {
    font-size: clamp(10px, 1.4vw, 13px);
    letter-spacing: 0.46em;
    text-transform: uppercase;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.92);
    text-shadow: 0 1px 10px rgba(0, 0, 20, 0.55);
  }
  .sub {
    margin-top: 6px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: clamp(9px, 1.1vw, 11px);
    letter-spacing: 0.2em;
    color: rgba(255, 255, 255, 0.55);
  }
  .kts {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: clamp(10px, 1.3vw, 13px);
    letter-spacing: 0.18em;
    color: rgba(255, 255, 255, 0.85);
    text-shadow: 0 1px 8px rgba(0, 0, 20, 0.5);
    text-align: right;
  }
  .panel {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: clamp(14px, 3vw, 30px);
    z-index: 2;
    display: flex;
    gap: clamp(14px, 3vw, 34px);
    align-items: flex-end;
    background: rgba(8, 12, 26, 0.42);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 12px;
    padding: 12px clamp(14px, 2.6vw, 24px);
    backdrop-filter: blur(8px);
  }
  .ctl { display: flex; flex-direction: column; gap: 6px; }
  .ctl label {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 9px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.6);
    display: flex;
    justify-content: space-between;
    gap: 12px;
  }
  .ctl label span { color: rgba(255, 255, 255, 0.9); }
  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    width: clamp(130px, 26vw, 220px);
    height: 3px;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.28);
    outline: none;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 13px; height: 13px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 8px rgba(255, 255, 255, 0.7);
  }
  input[type=range]::-moz-range-thumb {
    width: 13px; height: 13px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 8px rgba(255, 255, 255, 0.7);
  }
  @media (max-width: 480px) {
    .panel { flex-direction: column; gap: 10px; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="sky"></canvas></div>

<header class="hud">
  <div>
    <div class="name">Stratus / 5 Layers</div>
    <div class="sub" id="clock">HH:MM &middot; 5 LAYERS</div>
  </div>
  <div class="kts" id="kts">WIND 6 KTS</div>
</header>

<div class="panel">
  <div class="ctl">
    <label for="wind">Wind <span id="windval">6</span></label>
    <input type="range" id="wind" min="-50" max="50" value="6" step="1" aria-label="Wind speed and direction">
  </div>
  <div class="ctl">
    <label for="time">Time <span id="timeval">12:00</span></label>
    <input type="range" id="time" min="0" max="24" value="12" step="0.1" aria-label="Time of day">
  </div>
</div>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById("sky");
  var ctx = canvas.getContext("2d");
  var W = 0, H = 0, DPR = 1;
  var wind = 6;
  var hours = 12;
  var lastTs = 0;

  var STARKEYS = [0.6, 0.8, 2.0, 4.4, 22.0, 23.4];
  var SKYKEYS = [
    [0, [16, 26, 46]],
    [0.8, [255, 217, 168]],
    [6, [226, 240, 250]],
    [12, [207, 232, 245]],
    [17.5, [255, 224, 180]],
    [19.5, [242, 164, 106]],
    [21, [42, 34, 66]],
    [24, [16, 26, 46]]
  ];
  var TINTKEYS = [
    [0, 0.30],
    [1, 0.55],
    [5, 0.78],
    [9, 0.95],
    [12, 1.0],
    [15, 0.95],
    [18, 0.82],
    [20, 0.62],
    [21.5, 0.40],
    [24, 0.30]
  ];

  function lerp(a, b, k) { return a + (b - a) * k; }

  function keyTint(h) {
    for (let i = 0; i < TINTKEYS.length - 1; i++) {
      let a = TINTKEYS[i], b = TINTKEYS[i + 1];
      if (h >= a[0] && h <= b[0]) {
        return lerp(a[1], b[1], (h - a[0]) / (b[0] - a[0]));
      }
    }
    return 0.3;
  }

  function keySky(h) {
    for (let i = 0; i < SKYKEYS.length - 1; i++) {
      let a = SKYKEYS[i], b = SKYKEYS[i + 1];
      if (h >= a[0] && h <= b[0]) {
        let k = (h - a[0]) / (b[0] - a[0]);
        return [
          Math.round(lerp(a[1][0], b[1][0], k)),
          Math.round(lerp(a[1][1], b[1][1], k)),
          Math.round(lerp(a[1][2], b[1][2], k))
        ];
      }
    }
    return SKYKEYS[0][1];
  }

  function starAlpha(h) {
    let a = 0;
    if (h < STARKEYS[0]) a = 1;
    else if (h > STARKEYS[5]) a = 1;
    for (let i = 0; i < STARKEYS.length - 1; i++) {
      let lo = STARKEYS[i], hi = STARKEYS[i + 1];
      if (h >= lo && h <= hi) {
        let k = (h - lo) / (hi - lo);
        a = k < 0.5 ? k * 2 : (1 - k) * 2;
        break;
      }
    }
    return a;
  }

  function buildCloud(layerIdx, seed, col) {
    let c = document.createElement("canvas");
    let w = Math.max(480, Math.round(W * 0.75));
    let h = Math.max(320, Math.round(H * 0.7));
    c.width = w * DPR;
    c.height = h * DPR;
    let g = c.getContext("2d");
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    let rng = (n) => {
      let x = Math.sin(seed * 12.9898 + n * 78.233) * 43758.5453;
      return x - Math.floor(x);
    };
    let blobs = 200 + layerIdx * 50;
    for (let i = 0; i < blobs; i++) {
      let bx = rng(i * 3) * w;
      let by = h * 0.22 + rng(i * 3 + 1) * h * 0.6;
      let br = 24 + rng(i * 3 + 2) * (70 + layerIdx * 16);
      let alpha = 0.045 + rng(i * 7) * 0.075;
      let rg = g.createRadialGradient(bx, by, 0, bx, by, br);
      rg.addColorStop(0, "rgba(" + col[0] + "," + col[1] + "," + col[2] + "," + alpha.toFixed(3) + ")");
      rg.addColorStop(0.7, "rgba(" + col[0] + "," + col[1] + "," + col[2] + "," + (alpha * 0.45).toFixed(3) + ")");
      rg.addColorStop(1, "rgba(" + col[0] + "," + col[1] + "," + col[2] + ",0)");
      g.fillStyle = rg;
      g.beginPath();
      g.arc(bx, by, br, 0, 6.2832);
      g.fill();
    }
    return c;
  }

  var LAYERS = [];
  var stars = [];
  var birdPh = 0;

  function rebuild() {
    LAYERS = [];
    for (let i = 0; i < 5; i++) {
      LAYERS.push({
        seed: i * 13.37 + 1,
        img: null,
        yFrac: 0.10 + i * 0.155,
        speed: 7 + i * 8,
        skew: 0.02 + i * 0.014,
        x: i * 0.37
      });
    }
    stars = [];
    for (let i = 0; i < 140; i++) {
      let x = Math.sin(i * 127.1) * 43758.5453;
      let y = Math.sin(i * 311.7) * 24634.6345;
      stars.push({
        x: x - Math.floor(x),
        y: (y - Math.floor(y)) * 0.55,
        r: 0.5 + ((i * 13) % 10) / 8,
        tw: (i % 19) / 5
      });
    }
    retint();
  }

  function ambient() {
    let tint = keyTint(hours);
    return [
      Math.round(lerp(62, 255, tint)),
      Math.round(lerp(72, 255, tint)),
      Math.round(lerp(112, 255, tint))
    ];
  }

  function retint() {
    let col = ambient();
    for (let i = 0; i < LAYERS.length; i++) {
      let L = LAYERS[i];
      L.img = buildCloud(i, L.seed, col);
    }
  }

  function drawLayer(L, x) {
    if (!L.img) return;
    let iw = L.img.width / DPR;
    let ih = L.img.height / DPR;
    let y = L.yFrac * H - ih * 0.5;
    let k = (wind / 50) * L.skew;
    ctx.save();
    ctx.translate(x, y);
    ctx.transform(1, 0, k, 1, 0, 0);
    ctx.drawImage(L.img, 0, 0, iw, ih);
    ctx.restore();
  }

  function fit() {
    let r = canvas.parentElement.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, Math.floor(r.width));
    H = Math.max(1, Math.floor(r.height));
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  function drawBirds(c, tint) {
    let night = 1 - Math.min(1, Math.abs((hours - 12) / 4));
    if (night <= 0.05) return;
    let a = night * 0.75 * Math.min(1, tint + 0.15);
    c.save();
    c.globalAlpha = a;
    c.strokeStyle = "rgba(40,50,70,1)";
    c.lineCap = "round";
    let n = 4;
    for (let i = 0; i < n; i++) {
      let bx = ((birdPh * 0.018 + i * 0.24) % 1.1) * W - 0.05 * W;
      let by = H * 0.16 + i * 14 + Math.sin(birdPh * 0.9 + i * 2) * 5;
      let flap = Math.sin(birdPh * 1.4 + i * 1.7) * 3.2;
      c.lineWidth = 1.1;
      c.beginPath();
      c.moveTo(bx - 6, by - flap);
      c.quadraticCurveTo(bx - 2.4, by + 1.2, bx, by);
      c.quadraticCurveTo(bx + 2.4, by + 1.2, bx + 6, by - flap);
      c.stroke();
    }
    c.restore();
  }

  function frame(ts) {
    try {
      if (!lastTs) lastTs = ts;
      let dt = Math.min(0.05, (ts - lastTs) / 1000);
      lastTs = ts;
      birdPh += dt;

      let sky = keySky(hours);
      let tint = keyTint(hours);
      let g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, "rgb(" + sky[0] + "," + sky[1] + "," + sky[2] + ")");
      let low = [
        Math.min(255, Math.round(sky[0] * 1.06)),
        Math.min(255, Math.round(sky[1] * 1.04)),
        Math.min(255, Math.round(sky[2] * 1.02))
      ];
      g.addColorStop(1, "rgb(" + low[0] + "," + low[1] + "," + low[2] + ")");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      let sa = starAlpha(hours);
      if (sa > 0.02) {
        ctx.save();
        for (let i = 0; i < stars.length; i++) {
          let s = stars[i];
          ctx.globalAlpha = sa * (0.4 + 0.6 * Math.abs(Math.sin(birdPh * 0.8 + s.tw)));
          ctx.fillStyle = "#ffffff";
          ctx.beginPath();
          ctx.arc(s.x * W, s.y * H, s.r, 0, 6.2832);
          ctx.fill();
        }
        ctx.restore();
        ctx.globalAlpha = 1;

        let mx = W * 0.76, my = H * 0.2;
        let mg = ctx.createRadialGradient(mx, my, 0, mx, my, 70);
        mg.addColorStop(0, "rgba(220,230,255," + (0.5 * sa).toFixed(3) + ")");
        mg.addColorStop(1, "rgba(220,230,255,0)");
        ctx.fillStyle = mg;
        ctx.beginPath();
        ctx.arc(mx, my, 70, 0, 6.2832);
        ctx.fill();
        ctx.globalAlpha = sa;
        ctx.fillStyle = "#e8edf7";
        ctx.beginPath();
        ctx.arc(mx, my, 16, 0, 6.2832);
        ctx.fill();
        ctx.fillStyle = "rgb(" + sky[0] + "," + sky[1] + "," + sky[2] + ")";
        ctx.beginPath();
        ctx.arc(mx + 6.5, my - 3, 13, 0, 6.2832);
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      drawBirds(ctx, tint);

      for (let i = 0; i < LAYERS.length; i++) {
        let L = LAYERS[i];
        if (!L.img) continue;
        L.x += (wind / 50) * (L.speed / 30) * dt;
        let iw = L.img.width / DPR;
        let span = W + iw;
        let x = ((((L.x * span) % span) + span) % span) - iw;
        drawLayer(L, x);
      }

      let vg = ctx.createLinearGradient(0, 0, 0, H);
      vg.addColorStop(0, "rgba(255,255,255," + (0.06 * keyTint(hours)).toFixed(3) + ")");
      vg.addColorStop(1, "rgba(10,14,30,0.18)");
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, W, H);
    } catch (e) {
      return;
    }
    requestAnimationFrame(frame);
  }

  var windEl = document.getElementById("wind");
  var windVal = document.getElementById("windval");
  var timeEl = document.getElementById("time");
  var timeVal = document.getElementById("timeval");
  var clockEl = document.getElementById("clock");
  var ktsEl = document.getElementById("kts");

  function fmtTime(h) {
    let hh = Math.floor(h) % 24;
    let mm = Math.floor((h % 1) * 60);
    let p = (n) => (n < 10 ? "0" + n : "" + n);
    return p(hh) + ":" + p(mm);
  }

  function updateHud() {
    let sign = wind < 0 ? "-" : "";
    ktsEl.textContent = "WIND " + sign + Math.abs(Math.round(wind)) + " KTS";
    clockEl.innerHTML = fmtTime(hours) + " &middot; 5 LAYERS";
    windVal.textContent = String(Math.round(wind));
    timeVal.textContent = fmtTime(hours);
  }

  windEl.addEventListener("input", function () {
    wind = Number(windEl.value);
    updateHud();
  });
  timeEl.addEventListener("input", function () {
    hours = Number(timeEl.value);
    retint();
    updateHud();
  });
  window.addEventListener("resize", function () {
    fit();
    retint();
  });

  fit();
  rebuild();
  updateHud();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
