<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scramble Hero - Resolve</title>
<style>
  :root{
    --bg:#0a0a0a; --ink:#e8e6e2; --dim:#6d6a64; --faint:#3a3833;
    --accent:#ff4d2e; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    height:100dvh; overflow:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background-image:
      radial-gradient(ellipse 120% 80% at 50% 42%, #121110 0%, var(--bg) 62%),
      repeating-linear-gradient(0deg, rgba(255,255,255,.014) 0 1px, transparent 1px 3px);
  }
  .frame{
    position:relative;
    display:flex; flex-direction:column; align-items:center;
    padding:clamp(20px,6vmin,64px) clamp(16px,5vmin,56px);
    border:1px solid rgba(255,255,255,.055);
    border-radius:4px;
    background:rgba(255,255,255,.012);
    max-width:min(94vw, 1100px);
  }
  .frame .corner{
    position:absolute; width:9px; height:9px;
    border:1px solid var(--faint);
  }
  .corner.tl{top:-1px; left:-1px; border-right:none; border-bottom:none;}
  .corner.tr{top:-1px; right:-1px; border-left:none; border-bottom:none;}
  .corner.bl{bottom:-1px; left:-1px; border-right:none; border-top:none;}
  .corner.br{bottom:-1px; right:-1px; border-left:none; border-top:none;}
  .eyebrow{
    font-family:var(--mono);
    font-size:clamp(8px,1.5vmin,11px);
    letter-spacing:.34em; text-transform:uppercase;
    color:var(--faint);
    margin-bottom:clamp(14px,3vmin,30px);
    text-align:center;
  }
  .eyebrow b{color:var(--dim); font-weight:600;}
  .status{
    display:flex; align-items:center; gap:10px;
    font-family:var(--mono);
    font-size:clamp(8px,1.4vmin,11px);
    letter-spacing:.3em; text-transform:uppercase;
    color:var(--faint);
    margin-bottom:clamp(10px,2.4vmin,24px);
    text-align:center;
  }
  .status .state{color:var(--dim); min-width:11em; text-align:left;}
  .status .cursor{
    display:inline-block; width:.55em; height:1em;
    background:var(--accent); opacity:.75;
    animation:blink 1.1s steps(1) infinite;
    vertical-align:-0.15em;
  }
  @keyframes blink{0%,49%{opacity:.75;}50%,100%{opacity:.08;}}
  .status .count{color:var(--faint);}
  #hero{
    font-weight:800;
    font-size:clamp(26px, 8.2vmin, 100px);
    line-height:1.22;
    letter-spacing:.06em;
    text-transform:uppercase;
    text-align:center;
    max-width:24em;
    opacity:1;
    transition:opacity .34s ease, transform .34s ease, filter .34s ease;
  }
  #hero.out{opacity:0; transform:translateY(8px); filter:blur(3px);}
  .word{
    display:inline-block;
    margin:0 .14em;
    position:relative;
    cursor:default;
  }
  .letter{
    display:inline-block;
    width:.62em; text-align:center;
    color:var(--dim);
    transition:color .12s linear, transform .09s linear, filter .12s linear;
    will-change:transform;
  }
  .letter.jit{transform:translateY(-0.045em);}
  .letter.jit2{transform:translateY(0.04em);}
  .letter.head{filter:blur(0.6px);}
  .letter.on{color:var(--ink);}
  .letter.head{color:var(--accent);}
  .word.accent .letter{color:var(--accent); text-shadow:0 0 18px rgba(255,77,46,.35);}
  .word.accent .letter.on{color:var(--accent); text-shadow:0 0 18px rgba(255,77,46,.35);}
  .letter.on{ text-shadow:0 0 14px rgba(232,230,226,.14); }
  .word.pinned::after{
    content:"";
    position:absolute; left:0; right:0; bottom:-.18em;
    height:2px; background:var(--accent);
    opacity:.7; border-radius:1px;
    animation:pinpulse 1.2s ease-in-out infinite;
  }
  @keyframes pinpulse{
    0%,100%{opacity:.35;} 50%{opacity:.85;}
  }
  .foot{
    margin-top:clamp(18px,4vmin,44px);
    display:flex; align-items:center; gap:clamp(12px,2.4vw,24px);
    font-family:var(--mono);
    font-size:clamp(8px,1.5vmin,11px);
    letter-spacing:.28em; text-transform:uppercase;
    color:var(--faint);
  }
  .foot .ver{color:var(--dim);}
  .ticks{display:flex; align-items:center; gap:5px; height:18px;}
  .tick{position:relative; width:20px; height:2px; background:rgba(255,255,255,.09); overflow:hidden; border-radius:1px;}
  .tick .fill{position:absolute; inset:0; transform-origin:left center; transform:scaleX(0); background:var(--accent);}
  .tick.done .fill{transform:scaleX(1); background:var(--faint);}
</style>
</head>
<body>
<div class="frame">
  <span class="corner tl"></span><span class="corner tr"></span>
  <span class="corner bl"></span><span class="corner br"></span>
  <div class="eyebrow">RESOLVE SEQUENCE <b id="idx">01</b> / 05</div>
  <div class="status">
    <span>SIGNAL</span><span class="state" id="state">STANDBY</span>
    <span class="count" id="count">000 / 000</span><span class="cursor"></span>
  </div>
  <div id="hero"></div>
  <div class="foot">
    <span>Scramble / Resolve</span>
    <span class="ticks" id="ticks"></span>
    <span class="ver">- v0.9</span>
    <span class="ver" style="margin-left:6px">GLYPH SET 0-9 A-F &sect;</span>
  </div>
</div>
<script>
(function(){
'use strict';
var GLYPHS='0123456789abcdef\u00a7';
var PHRASES=[
  ['WE','BUILD','INVISIBLE','MACHINES'],
  ['NOISE','IS','THE','RAW','MATERIAL'],
  ['TYPE','IS','A','LIVING','INSTRUMENT'],
  ['GLYPHS','REMEMBER','THEIR','PAST'],
  ['SILENCE','COMPILES','INTO','FORM']
];
var ACCENT=[2, 3, 4, 1, 3];
var ROLL_MS=90, HOLD_S=2, FADE_MS=340;

var hero=document.getElementById('hero');
var idxEl=document.getElementById('idx');
var stateEl=document.getElementById('state');
var countEl=document.getElementById('count');
var ticksEl=document.getElementById('ticks');
var tickFills=[];
var phrase=0, phase='decode', lockPos=0, holdT=0, fading=0;
var words=[], letters=[], total=0, lastRoll=0, fadingUntil=0;

var i;
for(i=0;i<PHRASES.length;i++){
  var t=document.createElement('span');
  t.className='tick';
  var f=document.createElement('span');
  f.className='fill';
  t.appendChild(f);
  ticksEl.appendChild(t);
  tickFills.push(f);
}

function glyph(){ return GLYPHS.charAt((Math.random()*GLYPHS.length)|0); }
function decodeDur(n){ return 1.3 + n*0.055; }

function hud(){
  var locked=0, j;
  if(phase==='decode'){
    for(j=0;j<letters.length;j++){ if(letters[j].dataset.locked==='1') locked++; }
    stateEl.textContent=locked>=total ? 'RESOLVED' : 'SCRAMBLING';
  }else if(phase==='hold'){ stateEl.textContent='RESOLVED'; locked=total; }
  else{ stateEl.textContent='SIGNAL LOST'; }
  var s3=('000'+locked).slice(-3), t3=('000'+total).slice(-3);
  countEl.textContent=s3+' / '+t3;
}

function buildPhrase(k){
  var j;
  words.length=0; letters.length=0; total=0;
  hero.innerHTML='';
  var ph=PHRASES[k];
  for(j=0;j<ph.length;j++){
    var w=document.createElement('span');
    w.className='word'+(j===ACCENT[k]?' accent':'');
    var text=ph[j], li;
    for(li=0;li<text.length;li++){
      var l=document.createElement('span');
      l.className='letter';
      l.textContent=glyph();
      l.dataset.i=String(total);
      l.dataset.ch=text.charAt(li);
      l.dataset.locked='0';
      w.appendChild(l);
      letters.push(l);
      total++;
    }
    (function(wordEl){
      wordEl.addEventListener('pointerenter', function(){
        if(phase==='decode'){ wordEl.classList.add('pinned'); }
      });
      wordEl.addEventListener('pointerleave', function(){
        wordEl.classList.remove('pinned');
      });
    })(w);
    words.push(w);
    hero.appendChild(w);
  }
  lockPos=0; phase='decode'; holdT=0;
  idxEl.textContent=('0'+(k+1)).slice(-2);
}

function rollUnlocked(){
  var front=Math.floor(lockPos);
  var j,l,gi;
  for(j=0;j<letters.length;j++){
    l=letters[j];
    gi=+l.dataset.i;
    if(gi<front || l.dataset.locked==='1') continue;
    var pinned=l.parentNode.classList.contains('pinned');
    if(pinned) continue;
    l.textContent=glyph();
    var near=(gi-front)>=0 && (gi-front)<3;
    l.classList.toggle('head', near);
    var jr=Math.random();
    l.classList.toggle('jit', jr<0.45 && !near);
    l.classList.toggle('jit2', jr>=0.45 && jr<0.75 && !near);
  }
}

function lockUp(){
  var front=Math.floor(lockPos);
  var j,l;
  for(j=0;j<letters.length;j++){
    l=letters[j];
    if(+l.dataset.i<front && l.dataset.locked!=='1'){
      l.dataset.locked='1';
      l.textContent=l.dataset.ch;
      l.classList.add('on');
      l.classList.remove('head');
      l.classList.remove('jit');
      l.classList.remove('jit2');
    }
  }
}

function setTicks(){
  var prog=(phase==='decode') ? Math.min(1, lockPos/Math.max(1,total)) : 1;
  var j;
  for(j=0;j<tickFills.length;j++){
    if(j<phrase){ tickFills[j].parentElement.classList.add('done'); tickFills[j].style.transform='scaleX(1)'; }
    else if(j===phrase){
      tickFills[j].parentElement.classList.remove('done');
      tickFills[j].style.transform='scaleX('+prog.toFixed(4)+')';
    }
    else{ tickFills[j].parentElement.classList.remove('done'); tickFills[j].style.transform='scaleX(0)'; }
  }
}

function startNext(){
  if(phase!=='decode' && !fading) return;
  phase='fade';
  fading=1;
  fadingUntil=performance.now()+FADE_MS;
  hero.classList.add('out');
  words.forEach(function(w){ w.classList.remove('pinned'); });
}

function advance(){
  phrase=(phrase+1)%PHRASES.length;
  buildPhrase(phrase);
}

var lastT=performance.now();
function frame(t){
  try{
    var dt=(t-lastT)/1000;
    lastT=t;
    if(dt>0.1) dt=0.1;
    if(dt<0) dt=0;
    if(fading){
      if(t>=fadingUntil){
        fading=0;
        hero.classList.remove('out');
        advance();
      }
      setTicks();
      hud();
    }else{
      if(phase==='decode'){
        lockPos+=dt*(total/decodeDur(total));
        if(lockPos>=total){ lockPos=total; lockUp(); phase='hold'; holdT=0; }
        else lockUp();
      }else if(phase==='hold'){
        holdT+=dt;
        if(holdT>=HOLD_S) startNext();
      }
      if(t-lastRoll>=ROLL_MS){ lastRoll=t; if(phase==='decode') rollUnlocked(); }
      setTicks();
      hud();
    }
  }catch(err){ /* keep the loop alive */ }
  requestAnimationFrame(frame);
}
buildPhrase(0);
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
