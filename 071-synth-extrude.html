<!DOCTYPE html>
<html lang="en">
<head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Synth Extrude</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:#0d0a18;
    height:100dvh;
    overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex;align-items:center;justify-content:center;
    position:relative;
  }
  .grid{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      repeating-linear-gradient(0deg, rgba(120,90,220,.055) 0 1px, transparent 1px 56px),
      repeating-linear-gradient(90deg, rgba(255,46,136,.05) 0 1px, transparent 1px 56px),
      radial-gradient(70% 55% at 50% 44%, rgba(88,40,140,.35) 0%, rgba(20,12,40,.15) 55%, transparent 100%);
    -webkit-mask-image:radial-gradient(85% 80% at 50% 50%, #000 30%, transparent 100%);
    mask-image:radial-gradient(85% 80% at 50% 50%, #000 30%, transparent 100%);
  }
  .stage{
    position:relative;z-index:1;
    perspective:1100px;
    perspective-origin:50% 42%;
    width:100%;max-width:980px;
    text-align:center;
    touch-action:none;
    cursor:grab;
  }
  .stage:active{cursor:grabbing}
  .scene{
    display:inline-block;
    transform-style:preserve-3d;
    will-change:transform;
  }
  .word,.reflection{
    display:inline-block;
    transform-style:preserve-3d;
    white-space:nowrap;
    font-weight:900;
    font-size:clamp(58px,13.5vw,158px);
    letter-spacing:.04em;
    line-height:1;
  }
  .reflection{
    display:block;
    transform:scale(1,-1);
    transform-origin:50% 0%;
    margin-top:clamp(14px,2.6vh,30px);
    opacity:.12;
    filter:blur(6px) saturate(.8);
    -webkit-mask-image:linear-gradient(180deg, rgba(0,0,0,.9) 0%, transparent 62%);
    mask-image:linear-gradient(180deg, rgba(0,0,0,.9) 0%, transparent 62%);
    pointer-events:none;
  }
  .letter{
    position:relative;
    display:inline-block;
    transform-style:preserve-3d;
    transition:transform .34s cubic-bezier(.2,1.6,.4,1), filter .34s ease;
    padding:0 .03em;
  }
  .letter.hot{
    transform:translateZ(8px);
    filter:hue-rotate(38deg) brightness(1.12);
  }
  .layer{
    position:absolute;
    inset:0;
    display:block;
    user-select:none;
    -webkit-user-select:none;
  }
  .layer.front{
    position:relative;
    color:transparent;
    background-image:linear-gradient(105deg,
      #ff2e88 0%, #ff7ac8 22%, #fff6fb 34%, #ff9de0 46%,
      #ff2e88 62%, #b01d6f 82%, #ff2e88 100%);
    background-size:260% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    animation:shine 4.2s linear infinite;
  }
  @keyframes shine{
    0%{background-position:0% 0}
    100%{background-position:260% 0}
  }
  .hud{
    position:fixed;
    left:clamp(14px,3vw,34px);
    bottom:clamp(14px,3.5vh,32px);
    z-index:5;
    color:#8f7cc8;
    user-select:none;
    pointer-events:none;
  }
  .hud .name{
    font-size:clamp(10px,1.3vw,13px);
    letter-spacing:.42em;
    text-transform:uppercase;
    font-weight:600;
    color:#ff9de0;
  }
  .hud .meta{
    margin-top:6px;
    font-size:clamp(8px,1vw,11px);
    letter-spacing:.28em;
    text-transform:uppercase;
    color:rgba(143,124,200,.6);
    display:flex;gap:14px;align-items:center;flex-wrap:wrap;
  }
  .hud .meta span{pointer-events:auto}
  .hud input{
    pointer-events:auto;
    background:rgba(255,46,136,.07);
    border:1px solid rgba(255,46,136,.4);
    border-radius:6px;
    color:#ffd7ec;
    font-family:ui-monospace,monospace;
    font-size:11px;
    letter-spacing:.22em;
    padding:5px 9px;
    width:120px;
    text-transform:uppercase;
    outline:none;
  }
  .hud input:focus{border-color:#ff2e88;box-shadow:0 0 12px rgba(255,46,136,.35)}
  .hint{
    position:fixed;
    top:clamp(14px,3vh,28px);
    right:clamp(14px,3vw,34px);
    z-index:5;
    color:rgba(180,150,240,.5);
    font-size:clamp(8px,1vw,11px);
    letter-spacing:.34em;
    text-transform:uppercase;
    user-select:none;
    pointer-events:none;
  }
  @media (max-width:480px){
    .hint{display:none}
  }
</style>
</head>
<body>
<div class="grid" aria-hidden="true"></div>
<div class="stage" id="stage" aria-label="extruded neon word, drag to rotate">
  <div class="scene" id="scene">
    <div class="word" id="word"></div>
    <div class="reflection" id="reflection"></div>
  </div>
</div>
<div class="hint">drag to tilt - hover a plate - retype the word</div>
<div class="hud">
  <div class="name">Type / Extrude - 40 Plates</div>
  <div class="meta">
    <span>word<input id="wordInput" value="SYNTH" maxlength="8" spellcheck="false" aria-label="word 3 to 8 letters"></span>
  </div>
</div>
<script>
(function(){
  "use strict";
  var LAYERS=40;
  var stage=document.getElementById("stage");
  var scene=document.getElementById("scene");
  var wordEl=document.getElementById("word");
  var reflEl=document.getElementById("reflection");
  var input=document.getElementById("wordInput");
  var rotX=-4,rotY=0,velX=0,velY=0,dragging=false,lastX=0,lastY=0;
  var word="SYNTH";

  function hexToRgb(h){
    return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  }
  var FRONT=hexToRgb("#ff2e88"),BACK=hexToRgb("#3d1a6e");
  function layerColor(i){
    var t=i/(LAYERS-1);
    var r=Math.round(FRONT[0]+(BACK[0]-FRONT[0])*t);
    var g=Math.round(FRONT[1]+(BACK[1]-FRONT[1])*t);
    var b=Math.round(FRONT[2]+(BACK[2]-FRONT[2])*t);
    return"rgb("+r+","+g+","+b+")";
  }
  function escapeHtml(s){
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
  function buildStack(ch){
    var html='<span class="letter" data-ch="'+escapeHtml(ch)+'">';
    for(var i=LAYERS-1;i>=1;i--){
      html+='<span class="layer" style="transform:translateZ('+(-i*1.35).toFixed(2)+'px);color:'+layerColor(i)+'">'+escapeHtml(ch)+'</span>';
    }
    html+='<span class="layer front">'+escapeHtml(ch)+'</span>';
    html+='</span>';
    return html;
  }
  function rebuild(){
    wordEl.innerHTML="";reflEl.innerHTML="";
    var html="";
    for(var i=0;i<word.length;i++)html+=buildStack(word[i]);
    wordEl.innerHTML=html;
    reflEl.innerHTML=html;
    bindLetters(wordEl);bindLetters(reflEl);
  }
  function bindLetters(root){
    var letters=root.querySelectorAll(".letter");
    for(var i=0;i<letters.length;i++){
      (function(elp){
        elp.addEventListener("pointerenter",function(){elp.classList.add("hot");});
        elp.addEventListener("pointerleave",function(){elp.classList.remove("hot");});
      })(letters[i]);
    }
  }
  function sanitize(v){
    var s=(v||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
    if(s.length===0)s="SYNTH";
    while(s.length<3)s+="A";
    return s.slice(0,8);
  }
  input.addEventListener("change",function(){
    word=sanitize(input.value);
    input.value=word;
    rebuild();
  });
  input.addEventListener("keydown",function(e){
    if(e.key==="Enter"){input.blur();}
  });

  stage.addEventListener("pointerdown",function(e){
    dragging=true;lastX=e.clientX;lastY=e.clientY;
    velX=0;velY=0;
    if(stage.setPointerCapture)stage.setPointerCapture(e.pointerId);
  });
  window.addEventListener("pointermove",function(e){
    if(!dragging)return;
    var dx=e.clientX-lastX,dy=e.clientY-lastY;
    lastX=e.clientX;lastY=e.clientY;
    rotY=Math.max(-25,Math.min(25,rotY+dx*0.14));
    rotX=Math.max(-12,Math.min(12,rotX-dy*0.10));
    velY=dx*0.02;velX=-dy*0.015;
  });
  window.addEventListener("pointerup",function(){dragging=false;});
  window.addEventListener("pointercancel",function(){dragging=false;});

  var t0=performance.now();
  function frame(now){
    try{
      if(!dragging){
        rotY+=velY;rotX+=velX;
        velX*=0.92;velY*=0.92;
        rotY=Math.max(-25,Math.min(25,rotY));
        rotX=Math.max(-12,Math.min(12,rotX));
        rotY+=(-rotY*0.006);
        rotX+=(-rotX*0.006);
      }
      var sway=Math.sin((now-t0)*0.00045)*2.2;
      var bob=Math.cos((now-t0)*0.0007)*1.4;
      scene.style.transform="rotateX("+(rotX+bob).toFixed(3)+"deg) rotateY("+(rotY+sway).toFixed(3)+"deg)";
    }catch(err){/* never kill the loop */}
    requestAnimationFrame(frame);
  }

  rebuild();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
