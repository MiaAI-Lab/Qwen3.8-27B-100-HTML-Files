<!DOCTYPE html>
<html lang="en">
<head>
<meta charset=utf-8>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orrery · 023</title>
<style>
:root{
  --bg:#05070d;
  --ink:#cfd8ef;
  --dim:#67749a;
  --ring:#2a3550;
  --acc:#82aaff;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  overflow:hidden;
  height:100dvh;
  user-select:none;
  -webkit-user-select:none;
}
#sky{position:fixed;inset:0;display:block;touch-action:none;cursor:grab}
#sky.grab{cursor:grabbing}
.hud{
  position:fixed;left:clamp(14px,3.4vw,34px);bottom:clamp(14px,3.4vh,30px);
  z-index:3;pointer-events:none;
}
.hud .k{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:10px;letter-spacing:.38em;color:var(--dim);
}
.hud h1{
  font-size:clamp(22px,3.4vw,38px);font-weight:200;letter-spacing:.22em;
  margin-top:5px;color:#e6ecfb;
  text-shadow:0 0 24px rgba(130,170,255,.25);
}
.hud p{font-size:11px;color:var(--dim);letter-spacing:.09em;margin-top:7px}
.chips{
  position:fixed;top:clamp(12px,2.6vh,24px);right:clamp(14px,3.4vw,34px);
  display:flex;gap:6px;z-index:4;flex-wrap:wrap;justify-content:flex-end;
}
.chips button{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:10px;letter-spacing:.16em;
  padding:8px 13px;border-radius:999px;
  border:1px solid rgba(130,170,255,.22);
  background:rgba(9,13,23,.6);
  color:var(--dim);cursor:pointer;
  backdrop-filter:blur(8px);
  transition:color .25s,border-color .25s,background .25s,box-shadow .25s;
}
.chips button:hover{color:var(--ink);border-color:rgba(130,170,255,.5)}
.chips button.on{
  background:rgba(130,170,255,.14);
  color:#eaf0ff;
  border-color:rgba(130,170,255,.65);
  box-shadow:0 0 16px rgba(130,170,255,.18);
}
#card{
  position:fixed;top:50%;right:clamp(14px,3.4vw,34px);
  transform:translateY(-50%) translateX(18px);
  width:min(242px,64vw);
  padding:18px 20px 16px;
  border-radius:16px;
  background:rgba(12,17,30,.55);
  border:1px solid rgba(130,170,255,.24);
  backdrop-filter:blur(12px);
  box-shadow:0 18px 50px rgba(0,0,0,.45);
  opacity:0;pointer-events:none;
  transition:opacity .38s cubic-bezier(.2,.7,.2,1),transform .38s cubic-bezier(.2,.7,.2,1);
  z-index:4;
}
#card.show{opacity:1;transform:translateY(-50%);pointer-events:auto}
#card .name{display:flex;align-items:center;font-size:19px;font-weight:300;letter-spacing:.14em;color:#eef2ff}
#card .dot{width:11px;height:11px;border-radius:50%;margin-right:10px;flex:none;box-shadow:0 0 10px rgba(255,255,255,.25)}
#card .sub{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9px;letter-spacing:.3em;color:var(--dim);margin:5px 0 0 21px}
#card dl{margin-top:15px;display:grid;grid-template-columns:auto 1fr;gap:8px 16px}
#card dt{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9px;letter-spacing:.24em;color:var(--dim);padding-top:2px}
#card dd{text-align:right;font-size:12.5px;letter-spacing:.05em;color:#dfe6f8}
#card .rule{height:1px;background:linear-gradient(90deg,rgba(130,170,255,.4),transparent);margin:4px 0 2px}
@media(max-width:600px){
  #card{top:auto;bottom:96px;right:14px;transform:translateY(14px) }
  #card.show{transform:none}
  .hud p{display:none}
}
</style>
</head>
<body>
<canvas id="sky"></canvas>

<div class="hud">
  <div class="k">023 / 100</div>
  <h1>ORRERY</h1>
  <p>drag to tilt the plane · scroll to zoom · click a planet</p>
</div>

<div class="chips" id="chips">
  <button type="button" data-dps="1">1D</button>
  <button type="button" data-dps="7">1W</button>
  <button type="button" data-dps="30" class="on">1MO</button>
  <button type="button" data-dps="365">1Y</button>
  <button type="button" id="pause">PAUSE</button>
</div>

<aside id="card" aria-hidden="true">
  <div class="name"><span class="dot" id="dot"></span><span id="pName">Earth</span></div>
  <div class="sub" id="pSub">THIRD FROM THE SUN</div>
  <div class="rule"></div>
  <dl>
    <dt>ORBIT</dt><dd id="pAu">1.00 AU</dd>
    <dt>YEAR</dt><dd id="pYear">365.25 days</dd>
    <dt>DAY</dt><dd id="pDay">23.9 h</dd>
  </dl>
</aside>

<script>
(function(){
"use strict";
var sky=document.getElementById("sky");
var ctx=sky.getContext("2d");
var card=document.getElementById("card");
var pName=document.getElementById("pName");
var pSub=document.getElementById("pSub");
var pAu=document.getElementById("pAu");
var pYear=document.getElementById("pYear");
var pDay=document.getElementById("pDay");
var dot=document.getElementById("dot");
var chipsBox=document.getElementById("chips");
var pauseBtn=document.getElementById("pause");

var W=0,H=0,DPR=1,cx=0,cy=0;
var tilt=24,tiltT=24;          /* degrees, 0..60 */
var zoom=1,zoomT=1;
var daysPerSec=30,paused=false;
var simDays=0,last=0;
var sel=-1;
var dragging=false,dragY=0,moved=0;
var stars=[];
var TAU=Math.PI*2;

var P=[
  {n:"Mercury",c:"#a29a8c",au:"0.39 AU",yr:"88 days",dy:"58.6 d",o:70, s:3.0, days:88,   sub:"FIRST FROM THE SUN"},
  {n:"Venus",  c:"#e9c47f",au:"0.72 AU",yr:"224.7 days",dy:"243 d",o:96, s:5.0, days:225, sub:"SECOND FROM THE SUN"},
  {n:"Earth",  c:"#6f9fe8",au:"1.00 AU",yr:"365.25 days",dy:"23.9 h",o:126,s:5.4, days:365, sub:"THIRD FROM THE SUN"},
  {n:"Mars",   c:"#c1553b",au:"1.52 AU",yr:"687 days",dy:"24.6 h",o:158,s:4.2, days:687,  sub:"FOURTH FROM THE SUN"},
  {n:"Jupiter",c:"#d8b48a",au:"5.20 AU",yr:"11.86 yr",dy:"9.9 h",o:212, s:11.0,days:4333, sub:"FIFTH FROM THE SUN"},
  {n:"Saturn", c:"#e6d3a3",au:"9.58 AU",yr:"29.4 yr",dy:"10.7 h",o:262, s:9.5,days:10759,sub:"SIXTH FROM THE SUN",ring:true},
  {n:"Uranus", c:"#9fd8d4",au:"19.2 AU",yr:"84.0 yr",dy:"17.2 h",o:308, s:6.6,days:30687, sub:"SEVENTH FROM THE SUN"},
  {n:"Neptune",c:"#6b7fe8",au:"30.1 AU",yr:"164.8 yr",dy:"16.1 h",o:352, s:6.4,days:60190,sub:"EIGHTH FROM THE SUN"}
];
(function seed(){
  for(var i=0;i<P.length;i++){
    var p=P[i];
    p.sp=365*Math.pow(p.days/365,0.4);   /* compressed period, days */
    p.ph=i*2.39996323;                     /* golden-angle start */
    p.pts={x:0,y:0,r:0};
  }
})();

function fit(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;
  H=window.innerHeight;
  sky.width=Math.max(2,Math.round(W*DPR));
  sky.height=Math.max(2,Math.round(H*DPR));
  sky.style.width=W+"px";
  sky.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
  cx=W/2; cy=H*0.52;
  var n=Math.round(W*H/5200);
  stars.length=0;
  for(var i=0;i<n;i++){
    stars.push({
      x:Math.random()*W, y:Math.random()*H,
      r:0.2+Math.random()*1.1,
      p:Math.random()*TAU,
      s:0.3+Math.random()*1.4
    });
  }
}

function scale(){ return (Math.min(W,H)*0.5/382)*zoom; }

function planetAngle(p){ return p.ph + (simDays/p.sp)*TAU; }

function drawSun(sunR){
  var g=ctx.createRadialGradient(cx,cy,0,cx,cy,sunR*4.4);
  g.addColorStop(0,"rgba(255,214,130,0.55)");
  g.addColorStop(0.18,"rgba(255,190,110,0.22)");
  g.addColorStop(0.55,"rgba(255,170,90,0.05)");
  g.addColorStop(1,"rgba(255,170,90,0)");
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.arc(cx,cy,sunR*4.4,0,TAU);
  ctx.fill();
  var c=ctx.createRadialGradient(cx-sunR*0.25,cy-sunR*0.25,sunR*0.1,cx,cy,sunR);
  c.addColorStop(0,"#fff3d6");
  c.addColorStop(0.55,"#ffd27a");
  c.addColorStop(1,"#e8a84e");
  ctx.fillStyle=c;
  ctx.beginPath();
  ctx.arc(cx,cy,sunR,0,TAU);
  ctx.fill();
}

function render(t){
  var i,p,a;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle="#05070d";
  ctx.fillRect(0,0,W,H);

  /* faint nebula washes */
  var nw=ctx.createRadialGradient(W*0.2,H*0.16,0,W*0.2,H*0.16,W*0.55);
  nw.addColorStop(0,"rgba(58,80,140,0.10)");
  nw.addColorStop(1,"rgba(58,80,140,0)");
  ctx.fillStyle=nw; ctx.fillRect(0,0,W,H);
  var nw2=ctx.createRadialGradient(W*0.85,H*0.8,0,W*0.85,H*0.8,W*0.5);
  nw2.addColorStop(0,"rgba(120,70,110,0.06)");
  nw2.addColorStop(1,"rgba(120,70,110,0)");
  ctx.fillStyle=nw2; ctx.fillRect(0,0,W,H);

  /* starfield */
  for(i=0;i<stars.length;i++){
    var st=stars[i];
    var tw=0.22+0.6*(0.5+0.5*Math.sin(t*0.001*st.s+st.p));
    ctx.globalAlpha=tw;
    ctx.fillStyle="#cdd8f4";
    ctx.beginPath();
    ctx.arc(st.x,st.y,st.r,0,TAU);
    ctx.fill();
  }
  ctx.globalAlpha=1;

  var k=Math.cos(tilt*Math.PI/180);
  var s=scale();

  /* orbit rings (far half first for slight layering) */
  for(i=0;i<P.length;i++){
    p=P[i];
    var rr=p.o*s;
    ctx.beginPath();
    ctx.ellipse(cx,cy,rr,Math.max(1,rr*k),0,0,TAU);
    if(i===sel){
      ctx.strokeStyle="rgba(130,170,255,0.85)";
      ctx.lineWidth=1.5;
      ctx.shadowColor="rgba(130,170,255,0.5)";
      ctx.shadowBlur=9;
    }else{
      ctx.strokeStyle="rgba(42,53,80,0.95)";
      ctx.lineWidth=1;
      ctx.shadowBlur=0;
    }
    ctx.stroke();
    ctx.shadowBlur=0;
  }

  /* planet positions */
  var order=[];
  for(i=0;i<P.length;i++){
    p=P[i];
    a=planetAngle(p);
    var px=cx+p.o*s*Math.cos(a);
    var py=cy+p.o*s*k*Math.sin(a);
    var depth=(Math.sin(a)+1)/2;
    var pr=Math.max(2,p.s*(0.55+0.5*zoom)*(0.72+0.45*depth));
    p.pts.x=px; p.pts.y=py; p.pts.r=pr;
    p.pts.z=Math.sin(a);
    order.push(i);
  }
  order.sort(function(a2,b2){ return P[a2].pts.z-P[b2].pts.z; });

  drawSun(Math.max(9,15*zoom));

  for(var q=0;q<order.length;q++){
    p=P[order[q]];
    a=planetAngle(p);
    var light=0.55+0.45*Math.sin(a);
    ctx.save();
    if(p.pts.z>0){ ctx.shadowColor="rgba(0,0,0,0.0)"; }
    /* body */
    var bg=ctx.createRadialGradient(p.pts.x-p.pts.r*0.35,p.pts.y-p.pts.r*0.4,p.pts.r*0.15,p.pts.x,p.pts.y,p.pts.r);
    bg.addColorStop(0,lighten(p.c,0.55));
    bg.addColorStop(0.65,p.c);
    bg.addColorStop(1,shade(p.c,0.45));
    ctx.fillStyle=bg;
    ctx.beginPath();
    ctx.arc(p.pts.x,p.pts.y,p.pts.r,0,TAU);
    ctx.fill();
    if(p.ring){
      ctx.beginPath();
      ctx.ellipse(p.pts.x,p.pts.y,p.pts.r*1.95,p.pts.r*0.62,-0.42,0,TAU);
      ctx.strokeStyle="rgba(230,211,163,0.65)";
      ctx.lineWidth=Math.max(1,p.pts.r*0.16);
      ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(p.pts.x,p.pts.y,p.pts.r*2.3,p.pts.r*0.74,-0.42,0,TAU);
      ctx.strokeStyle="rgba(230,211,163,0.25)";
      ctx.lineWidth=Math.max(0.6,p.pts.r*0.08);
      ctx.stroke();
    }
    if(order[q]===sel){
      ctx.beginPath();
      ctx.arc(p.pts.x,p.pts.y,p.pts.r+5,0,TAU);
      ctx.strokeStyle="rgba(200,220,255,0.8)";
      ctx.lineWidth=1.2;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(p.pts.x,p.pts.y,p.pts.r+9,0,TAU);
      ctx.strokeStyle="rgba(160,190,255,0.25)";
      ctx.lineWidth=1;
      ctx.stroke();
    }
    ctx.restore();
  }
}

function lighten(hex,f){
  var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  r=Math.min(255,Math.round(r+(255-r)*f));
  g=Math.min(255,Math.round(g+(255-g)*f));
  b=Math.min(255,Math.round(b+(255-b)*f));
  return "rgb("+r+","+g+","+b+")";
}
function shade(hex,f){
  var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  r=Math.round(r*(1-f)); g=Math.round(g*(1-f)); b=Math.round(b*(1-f));
  return "rgb("+r+","+g+","+b+")";
}

function setCard(i){
  var p=P[i];
  pName.textContent=p.n;
  pSub.textContent=p.sub;
  pAu.textContent=p.au;
  pYear.textContent=p.yr;
  pDay.textContent=p.dy;
  dot.style.background=p.c;
  dot.style.boxShadow="0 0 12px "+p.c;
  card.classList.add("show");
  card.setAttribute("aria-hidden","false");
}
function hideCard(){
  card.classList.remove("show");
  card.setAttribute("aria-hidden","true");
}

function frame(t){
  requestAnimationFrame(frame);
  try{
    if(!last){ last=t; }
    var dt=Math.min(0.05,(t-last)/1000);
    last=t;
    if(dt<0){ dt=0; }
    if(!paused){ simDays+=dt*daysPerSec; }
    tilt+=(tiltT-tilt)*Math.min(1,dt*6);
    zoom+=(zoomT-zoom)*Math.min(1,dt*6);
    render(t);
  }catch(err){
    /* keep the loop alive */
  }
}

/* ---- pointer: drag tilt + click select ---- */
sky.addEventListener("pointerdown",function(e){
  dragging=true; moved=0; dragY=e.clientY;
  sky.classList.add("grab");
  try{ sky.setPointerCapture(e.pointerId); }catch(_){ }
});
sky.addEventListener("pointermove",function(e){
  if(!dragging){ return; }
  var dy=e.clientY-dragY;
  dragY=e.clientY;
  moved+=Math.abs(dy);
  tiltT=Math.max(0,Math.min(60,tiltT+dy*0.25));
});
sky.addEventListener("pointerup",function(e){
  dragging=false;
  sky.classList.remove("grab");
  if(moved>7){ return; }
  var hit=-1,best=1e9;
  for(var i=0;i<P.length;i++){
    var p=P[i];
    var dx=e.clientX-p.pts.x, dyy=e.clientY-p.pts.y;
    var d2=dx*dx+dyy*dyy;
    var rr=Math.max(14,p.pts.r*1.9)+6;
    if(d2<rr*rr && d2<best){ best=d2; hit=i; }
  }
  if(hit>=0 && hit!==sel){ sel=hit; setCard(hit); }
  else if(hit===-1){ sel=-1; hideCard(); }
});
sky.addEventListener("pointercancel",function(){ dragging=false; sky.classList.remove("grab"); });

/* ---- wheel zoom ---- */
window.addEventListener("wheel",function(e){
  e.preventDefault();
  zoomT=Math.max(0.45,Math.min(2.8,zoomT*Math.exp(-e.deltaY*0.0012)));
},{passive:false});

/* ---- time chips ---- */
chipsBox.addEventListener("click",function(e){
  var b=e.target.closest("button");
  if(!b){ return; }
  if(b===pauseBtn){
    paused=!paused;
    b.classList.toggle("on",paused);
    b.textContent=paused?"RESUME":"PAUSE";
    return;
  }
  daysPerSec=parseInt(b.getAttribute("data-dps"),10)||30;
  paused=false;
  pauseBtn.classList.remove("on");
  pauseBtn.textContent="PAUSE";
  var bs=chipsBox.querySelectorAll("button");
  for(var i=0;i<bs.length;i++){ bs[i].classList.toggle("on",bs[i]===b); }
});

window.addEventListener("resize",function(){ fit(); });
fit();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
