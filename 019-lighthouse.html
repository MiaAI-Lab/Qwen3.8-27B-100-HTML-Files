<!DOCTYPE html>
<html lang="en">
<head>
<meta charset=utf-8>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Lighthouse — No. 019</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%}
body{background:#0b1026;overflow:hidden;font-family:Georgia,'Times New Roman',serif}
#scene{position:fixed;inset:0;display:block;cursor:crosshair}
.hud{position:fixed;top:0;left:0;right:0;z-index:2;pointer-events:none;
  display:flex;justify-content:space-between;align-items:flex-start;
  padding:clamp(14px,3.2vh,30px) clamp(16px,4.5vw,44px)}
h1{font-weight:400;color:#e8edf6;text-transform:uppercase;
  font-size:clamp(17px,3.1vw,30px);letter-spacing:clamp(0.28em,0.5vw,0.5em);
  text-shadow:0 0 22px rgba(130,160,255,0.35),0 2px 6px rgba(0,0,0,0.6)}
.log{font-family:ui-monospace,Menlo,Consolas,monospace;text-transform:uppercase;
  font-size:clamp(9px,1.3vw,12px);letter-spacing:0.24em;color:#8fa1c2;
  text-align:right;line-height:1.9;text-shadow:0 1px 4px rgba(0,0,0,0.7)}
.log b{color:#ffd98a;font-weight:400}
.log.tick b{animation:flash 0.7s ease}
@keyframes flash{0%{color:#fff;text-shadow:0 0 12px rgba(255,220,150,0.9)}100%{color:#ffd98a}}
.caption{position:fixed;bottom:0;left:0;right:0;z-index:2;pointer-events:none;
  text-align:center;font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:clamp(8px,1.1vw,11px);letter-spacing:0.38em;color:rgba(143,161,194,0.7);
  text-transform:uppercase;padding-bottom:clamp(10px,2.2vh,20px)}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<header class="hud">
  <h1>The Lighthouse</h1>
  <p class="log" id="log">Keeper's Log<br><span>Beams swept</span> <b id="sw">00</b></p>
</header>
<p class="caption">No. 019 — Lighthouse Watch</p>
<script>
(function(){
"use strict";
const canvas=document.getElementById('scene');
const ctx=canvas.getContext('2d');
const logEl=document.getElementById('log');
const swEl=document.getElementById('sw');
let W=0,H=0,DPR=1;
let stars=[];
let ripples=[];
let swShown=-1;
const T0=performance.now();
const PI2=Math.PI*2;

function mulberry(seed){
  let s=seed>>>0;
  return function(){
    s=(s+0x6D2B79F5)|0;
    let x=Math.imul(s^(s>>>15),1|s);
    x=(x+Math.imul(x^(x>>>7),61|x))^x;
    return ((x^(x>>>14))>>>0)/4294967296;
  };
}

function fit(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth;
  H=window.innerHeight;
  canvas.width=Math.round(W*DPR);
  canvas.height=Math.round(H*DPR);
  canvas.style.width=W+'px';
  canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const r=mulberry(20260815);
  stars=[];
  const n=Math.max(70,Math.round(W*H/8500));
  for(let i=0;i<n;i++){
    stars.push({x:r()*W,y:r()*H*0.52,s:0.4+r()*1.3,p:r()*PI2,sp:0.4+r()*1.6});
  }
}

function geo(){
  const horizon=H*0.46;
  return {
    horizon:horizon,
    lamp:{x:W*0.17,y:H*0.155},
    boat:{x:W*0.72,y:horizon+H*0.075},
    moon:{x:W*0.82,y:horizon-H*0.055,r:Math.max(9,H*0.034)}
  };
}

function angDiff(a,b){
  let d=(a-b)%PI2;
  if(d>Math.PI)d-=PI2;
  if(d<-Math.PI)d+=PI2;
  return d;
}

function surfacePath(rowY,amp,k,sp,ph,tSec){
  ctx.beginPath();
  ctx.moveTo(-4,rowY);
  for(let x=0;x<=W+8;x+=8){
    const y=rowY+amp*Math.sin(x*k+tSec*sp+ph)+amp*0.45*Math.sin(x*k*2.31-tSec*sp*1.45+ph*2);
    ctx.lineTo(x,y);
  }
}

function drawCone(cx,cy,ang){
  const L=Math.max(W,H)*1.35;
  const hw=0.055;
  const gr=ctx.createRadialGradient(cx,cy,6,cx,cy,L);
  gr.addColorStop(0,'rgba(255,236,190,0.32)');
  gr.addColorStop(0.25,'rgba(255,236,190,0.13)');
  gr.addColorStop(1,'rgba(255,236,190,0)');
  ctx.beginPath();
  ctx.moveTo(cx,cy);
  ctx.arc(cx,cy,L,ang-hw,ang+hw);
  ctx.closePath();
  ctx.fillStyle=gr;
  ctx.fill();
  const g2=ctx.createRadialGradient(cx,cy,2,cx,cy,L*0.9);
  g2.addColorStop(0,'rgba(255,246,220,0.5)');
  g2.addColorStop(1,'rgba(255,246,220,0)');
  ctx.beginPath();
  ctx.moveTo(cx,cy);
  ctx.arc(cx,cy,L*0.9,ang-hw*0.35,ang+hw*0.35);
  ctx.closePath();
  ctx.fillStyle=g2;
  ctx.fill();
}

function fogBand(cx,cy,rx,ry,a){
  ctx.save();
  ctx.translate(cx,cy);
  ctx.scale(1,ry/rx);
  const gr=ctx.createRadialGradient(0,0,0,0,0,rx);
  gr.addColorStop(0,'rgba(205,218,235,'+a+')');
  gr.addColorStop(1,'rgba(205,218,235,0)');
  ctx.fillStyle=gr;
  ctx.beginPath();
  ctx.arc(0,0,rx,0,PI2);
  ctx.fill();
  ctx.restore();
}

function draw(ts){
  const tSec=(ts-T0)/1000;
  const g=geo();
  const horizon=g.horizon;
  const th=(tSec/8)*PI2;
  const bearing=Math.atan2(g.boat.y-g.lamp.y,g.boat.x-g.lamp.x);
  const hit=Math.max(0,1-Math.min(Math.abs(angDiff(th,bearing)),Math.abs(angDiff(th,bearing+Math.PI)))/0.12);

  // --- sky ---
  const sky=ctx.createLinearGradient(0,0,0,horizon+H*0.12);
  sky.addColorStop(0,'#0b1026');
  sky.addColorStop(0.65,'#0d1430');
  sky.addColorStop(1,'#111a38');
  ctx.fillStyle=sky;
  ctx.fillRect(0,0,W,horizon+2);

  // stars
  ctx.fillStyle='#dfe8fa';
  for(let i=0;i<stars.length;i++){
    const s=stars[i];
    if(s.y>horizon-6)continue;
    ctx.globalAlpha=0.3+0.6*(0.5+0.5*Math.sin(tSec*s.sp+s.p));
    ctx.fillRect(s.x,s.y,s.s,s.s);
  }
  ctx.globalAlpha=1;

  // moon halo + disc
  const m=g.moon;
  const halo=ctx.createRadialGradient(m.x,m.y,m.r*0.4,m.x,m.y,m.r*4.4);
  halo.addColorStop(0,'rgba(216,228,255,0.30)');
  halo.addColorStop(0.4,'rgba(216,228,255,0.10)');
  halo.addColorStop(1,'rgba(216,228,255,0)');
  ctx.fillStyle=halo;
  ctx.beginPath();ctx.arc(m.x,m.y,m.r*4.4,0,PI2);ctx.fill();
  ctx.fillStyle='#e9eef8';
  ctx.beginPath();ctx.arc(m.x,m.y,m.r,0,PI2);ctx.fill();
  ctx.fillStyle='rgba(150,168,200,0.18)';
  ctx.beginPath();ctx.arc(m.x-m.r*0.25,m.y-m.r*0.15,m.r*0.3,0,PI2);ctx.fill();
  ctx.beginPath();ctx.arc(m.x+m.r*0.2,m.y+m.r*0.3,m.r*0.18,0,PI2);ctx.fill();

  // --- headland ---
  ctx.fillStyle='#05080f';
  ctx.beginPath();
  ctx.moveTo(0,horizon+H*0.02);
  ctx.lineTo(0,H*0.335);
  ctx.quadraticCurveTo(W*0.07,H*0.30,W*0.135,H*0.285);
  ctx.quadraticCurveTo(W*0.20,H*0.262,W*0.255,H*0.278);
  ctx.quadraticCurveTo(W*0.31,H*0.30,W*0.345,horizon+H*0.004);
  ctx.closePath();
  ctx.fill();

  // --- tower ---
  const bx=g.lamp.x, by=H*0.285, tw=Math.max(9,W*0.0115), thh=H*0.13, topW=tw*0.78;
  ctx.beginPath();
  ctx.moveTo(bx-tw/2,by);
  ctx.lineTo(bx+tw/2,by);
  ctx.lineTo(bx+topW/2,by-thh);
  ctx.lineTo(bx-topW/2,by-thh);
  ctx.closePath();
  ctx.fillStyle='#d9d3c7';
  ctx.fill();
  ctx.save();
  ctx.clip();
  ctx.fillStyle='#a83f36';
  const stripe=thh/7;
  for(let i=0;i<7;i++){
    if(i%2===1)ctx.fillRect(bx-tw,by-thh+i*stripe,tw*2,stripe);
  }
  ctx.fillStyle='rgba(0,0,0,0.22)';
  ctx.fillRect(bx+topW*0.15,by-thh,tw*0.55,thh);
  ctx.restore();
  ctx.fillStyle='#20242e';
  ctx.fillRect(bx-topW*0.75,by-thh-thh*0.045,topW*1.5,thh*0.045+1);
  const glassH=thh*0.17;
  ctx.fillStyle='rgba(255,238,196,0.95)';
  ctx.fillRect(bx-topW*0.45,by-thh-thh*0.045-glassH,topW*0.9,glassH);
  ctx.strokeStyle='#2a2e38';
  ctx.lineWidth=1;
  ctx.strokeRect(bx-topW*0.45,by-thh-thh*0.045-glassH,topW*0.9,glassH);
  ctx.fillStyle='#7c2f2c';
  ctx.beginPath();
  ctx.arc(bx,by-thh-thh*0.045-glassH,topW*0.5,Math.PI,0);
  ctx.fill();
  ctx.strokeStyle='#3a3f4b';
  ctx.beginPath();
  ctx.moveTo(bx,by-thh-thh*0.045-glassH-topW*0.5);
  ctx.lineTo(bx,by-thh-thh*0.045-glassH-topW*0.75);
  ctx.stroke();
  // lamp glow
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  const lg=ctx.createRadialGradient(bx,g.lamp.y,1,bx,g.lamp.y,topW*3.4);
  lg.addColorStop(0,'rgba(255,232,180,0.6)');
  lg.addColorStop(1,'rgba(255,232,180,0)');
  ctx.fillStyle=lg;
  ctx.beginPath();ctx.arc(bx,g.lamp.y,topW*3.4,0,PI2);ctx.fill();
  ctx.restore();

  // --- sea ---
  const sea=ctx.createLinearGradient(0,horizon,0,H);
  sea.addColorStop(0,'#0e2133');
  sea.addColorStop(1,'#07121e');
  ctx.fillStyle=sea;
  ctx.fillRect(0,horizon,W,H-horizon);
  const rowCols=['#0d1f31','#0c1b2b','#0a1626'];
  for(let r=0;r<3;r++){
    const rowY=horizon+(r+1)*H*0.042;
    const amp=1.5+r*1.6;
    const k=0.018-r*0.004;
    const sp=0.5+r*0.45;
    const ph=r*1.7;
    surfacePath(rowY,amp,k,sp,ph,tSec);
    ctx.lineWidth=1;
    ctx.strokeStyle='rgba(150,190,230,'+(0.05+0.035*r)+')';
    ctx.stroke();
    surfacePath(rowY,amp,k,sp,ph,tSec);
    ctx.lineTo(W+8,H+8);
    ctx.lineTo(-4,H+8);
    ctx.closePath();
    ctx.fillStyle=rowCols[r];
    ctx.fill();
  }
  // moon reflection shimmer
  for(let i=0;i<8;i++){
    const yy=horizon+8+i*H*0.021;
    const len=H*0.045*(1-i/9.5)*(0.6+0.4*Math.sin(tSec*0.8+i*2.1));
    ctx.strokeStyle='rgba(220,232,255,'+(0.055*(1-i/9))+')';
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(m.x-len/2+Math.sin(tSec*0.5+i)*3,yy);
    ctx.lineTo(m.x+len/2+Math.sin(tSec*0.5+i)*3,yy);
    ctx.stroke();
  }

  // --- boat ---
  const s=Math.max(0.7,H/800);
  const bob=Math.sin(tSec*1.1)*1.6;
  const tilt=Math.sin(tSec*0.9)*0.03;
  ctx.save();
  ctx.translate(g.boat.x,g.boat.y+bob);
  ctx.rotate(tilt);
  ctx.scale(s,s);
  ctx.fillStyle='#04070d';
  ctx.beginPath();
  ctx.moveTo(-16,0);
  ctx.quadraticCurveTo(-14,5,-8,6);
  ctx.lineTo(9,6);
  ctx.quadraticCurveTo(15,5,17,-1);
  ctx.quadraticCurveTo(8,-3,6,0);
  ctx.closePath();
  ctx.fill();
  ctx.fillRect(-4,-8,10,8);
  ctx.fillRect(-5,-9,12,2);
  ctx.fillRect(5,-17,1,9);
  if(hit>0.02){
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    const wg=ctx.createRadialGradient(1,-5,0,1,-5,9);
    wg.addColorStop(0,'rgba(255,196,120,'+(0.85*hit)+')');
    wg.addColorStop(1,'rgba(255,196,120,0)');
    ctx.fillStyle=wg;
    ctx.beginPath();ctx.arc(1,-5,9,0,PI2);ctx.fill();
    ctx.fillStyle='rgba(255,225,170,'+Math.min(1,hit*1.6)+')';
    ctx.fillRect(-1,-7,3.5,4);
    ctx.restore();
  }
  ctx.restore();

  // --- ripples ---
  for(let i=ripples.length-1;i>=0;i--){
    const rp=ripples[i];
    const age=tSec-rp.t0;
    if(age>2.4){ripples.splice(i,1);continue;}
    for(let j=0;j<3;j++){
      const rr=4+age*(26+j*11);
      const al=(1-age/2.4)*0.32*(1-j*0.22);
      if(al<=0)continue;
      ctx.save();
      ctx.translate(rp.x,rp.y+Math.sin(age*6)*0.6);
      ctx.scale(1,0.32);
      ctx.strokeStyle='rgba(190,215,240,'+al+')';
      ctx.lineWidth=1.2;
      ctx.beginPath();
      ctx.arc(0,0,rr,0,PI2);
      ctx.stroke();
      ctx.restore();
    }
  }

  // --- fog ---
  fogBand(W*(0.55+0.32*Math.sin(tSec*0.05)),horizon+H*0.05,W*0.42,H*0.035,0.055);
  fogBand(W*(0.45-0.28*Math.sin(tSec*0.037+2)),horizon+H*0.13,W*0.36,H*0.03,0.045);

  // --- beam ---
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  drawCone(g.lamp.x,g.lamp.y,th);
  drawCone(g.lamp.x,g.lamp.y,th+Math.PI);
  ctx.restore();

  // --- keeper's log ---
  const sw=Math.floor(tSec/8);
  if(sw!==swShown){
    swShown=sw;
    swEl.textContent=String(sw).padStart(2,'0');
    logEl.classList.remove('tick');
    void logEl.offsetWidth;
    logEl.classList.add('tick');
  }
}

function frame(ts){
  try{
    if(!W||!H)fit();
    draw(ts);
  }catch(e){/* never kill the frame */}
  requestAnimationFrame(frame);
}

canvas.addEventListener('pointerdown',function(ev){
  const rect=canvas.getBoundingClientRect();
  const x=ev.clientX-rect.left;
  const y=ev.clientY-rect.top;
  if(y>geo().horizon+2){
    ripples.push({x:x,y:y,t0:(performance.now()-T0)/1000});
    if(ripples.length>24)ripples.shift();
  }
});

window.addEventListener('resize',fit);
fit();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
